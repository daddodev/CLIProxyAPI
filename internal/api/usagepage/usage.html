<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Usage · CLIProxyAPI</title>
<style>
:root {
    color-scheme: light;
    --bg: #ffffff;
    --bg-2: #f4f4f5;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --line: #d4d4d8;
    --line-2: #a1a1aa;
    --track: #e4e4e7;
    --text: #18181b;
    --muted: #52525b;
    --faint: #8b8b94;
    --ok: #108846;
    --warn: #bb6900;
    --bad: #c52c2a;
    --claude: #cc5824;
    --codex: #007ea8;
    --focus: #2350f0;
    --shadow: 0 1px 2px #00000010;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
    --sans: "Inter", "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body {
    margin: 0;
    min-height: 100vh;
    font: 14px/1.45 var(--sans);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0 }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 32px) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }

.brand-mark { position: relative; width: 22px; height: 14px; flex: none }
.brand-mark::before, .brand-mark::after {
    content: "";
    position: absolute;
    top: 0;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    mix-blend-mode: multiply;
}
.brand-mark::before { left: 0; background: var(--claude) }
.brand-mark::after { right: 0; background: var(--codex) }

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 32px;
    padding: 0 12px;
    border-radius: 9px;
    border: 1px solid var(--line-2);
    background: var(--surface);
    font-size: 13px;
    font-weight: 550;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.btn:hover { background: var(--surface-2) }
.btn:disabled { cursor: default; opacity: 0.6 }
.btn-icon { width: 32px; padding: 0 }
.btn-icon svg { width: 16px; height: 16px }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent }
.btn-primary:hover { background: #363637 }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn-ghost:hover { color: var(--text); background: var(--surface-2) }
.btn-accent {
    color: var(--pc);
    border-color: var(--pc-edge);
    background: var(--pc-soft);
}
.btn-accent:hover { background: var(--pc-hover) }
.btn-commit { background: var(--pc); color: #fff; border-color: transparent }
.btn-commit:hover { filter: brightness(0.9) }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; flex: none }
@keyframes spin { to { transform: rotate(360deg) } }

/* Sections */
main { padding-bottom: 48px }
.sec { margin-top: 30px }
.sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 14px }
.sec-title { margin: 0; display: flex; align-items: baseline; gap: 12px; font-size: clamp(21px, 2.4vw, 27px); font-weight: 680; letter-spacing: -0.03em; line-height: 1.1 }
.sec-idx { font: 500 11px var(--mono); letter-spacing: 0.16em; color: var(--faint) }
.sec-meta { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: flex-end }
.range-desc { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.notice {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    border: 1px solid #bb690059;
    background: #bb690014;
}
.notice::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none }
.notice.bad { border-color: #c52c2a59; background: #c52c2a14 }
.notice.bad::before { background: var(--bad) }
.notice.ok { border-color: #10884659; background: #10884614 }
.notice.ok::before { background: var(--ok) }

/* Segmented controls */
.seg-ctl { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow) }
.seg-ctl legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
fieldset.seg-ctl { margin: 0; min-width: 0 }
.seg-ctl label { position: relative; display: block }
.seg-ctl input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer }
.seg-ctl span { display: block; padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 550; color: var(--muted); transition: background 0.18s, color 0.18s; pointer-events: none }
.seg-ctl label:hover span { color: var(--text) }
.seg-ctl input:checked + span { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2) }
.seg-ctl input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 1px }

/* Provider cards */
.providers { display: grid; align-items: start; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 540px), 1fr)) }
.prov {
    --pc: #5b5f68;
    --pc-soft: #5b5f681a;
    --pc-hover: #5b5f6830;
    --pc-edge: #5b5f6866;
    --pc-glow: #5b5f6899;
    position: relative;
    isolation: isolate;
    padding: 18px 18px 4px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    overflow: hidden;
}
.prov::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, var(--pc), transparent 75%) }
.prov::after { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(28rem 12rem at 0% 0%, var(--pc-soft), transparent 70%); pointer-events: none }
.prov-claude, .pop-claude { --pc: #cc5824; --pc-soft: #cc58241a; --pc-hover: #cc582430; --pc-edge: #cc582466; --pc-glow: #cc582499 }
.prov-codex, .pop-codex { --pc: #007ea8; --pc-soft: #007ea81a; --pc-hover: #007ea830; --pc-edge: #007ea866; --pc-glow: #007ea899 }
.prov-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap }
.prov-name { margin: 0; font-size: 19px; font-weight: 680; letter-spacing: -0.025em; display: flex; align-items: center; gap: 9px }
.prov-glyph { width: 10px; height: 10px; border-radius: 3px; background: var(--pc); box-shadow: 0 0 12px var(--pc-glow); transform: rotate(45deg) }
.prov-codex .prov-glyph { border-radius: 50%; transform: none }
.prov-count { font: 12px var(--mono); color: var(--muted) }
.prov-note { margin: 0; padding: 10px 0 12px; border-top: 1px solid var(--line); font: 11.5px var(--mono); color: var(--warn); overflow-wrap: anywhere }
.reset-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    margin-left: auto;
    padding: 0 8px 0 10px;
    border-radius: 99px;
    border: 0;
    background: transparent;
    box-shadow: inset 0 0 0 1px var(--line-2);
    color: var(--muted);
    font: 500 11.5px var(--mono);
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}
.reset-btn:hover, .reset-btn[aria-expanded="true"] { color: var(--text); background: var(--surface-2) }
.reset-btn svg { width: 12px; height: 12px; transition: transform 0.2s var(--ease) }
.reset-btn[aria-expanded="true"] svg { transform: rotate(180deg) }
.reset-btn.has { color: var(--pc); background: var(--pc-soft); box-shadow: inset 0 0 0 1px var(--pc-edge) }
.reset-btn.has:hover, .reset-btn.has[aria-expanded="true"] { background: var(--pc-hover) }
.reset-btn.alert::after { content: ""; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--surface) }

/* Gauges */
.gauges, .cells { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); column-gap: clamp(14px, 3vw, 28px) }
.gauges { row-gap: 6px; margin: 14px 0 12px }
.gauge { container-type: inline-size; width: 100%; max-width: 210px; justify-self: center; text-align: center }
.g-dial { position: relative }
.g-dial svg { display: block; width: 100%; height: auto; overflow: visible }
.g-center { position: absolute; inset: 0 0 12% 0; display: flex; flex-direction: column; align-items: center; justify-content: center }
.g-val { font: 640 clamp(19px, 19cqw, 42px)/1 var(--mono); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; transition: color 0.3s }
.g-val small { font-size: 0.5em; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 0.06em }
.g-val.hot { color: var(--warn) }
.g-val.full { color: var(--bad) }
.g-cap { margin-top: 0.35em; font: clamp(10px, 7.4cqw, 12.5px) var(--mono); color: var(--muted) }
.g-held { margin-top: 0.15em; font: clamp(9.5px, 6.6cqw, 11px) var(--mono); color: var(--faint) }
.g-label { position: absolute; left: 0; right: 0; bottom: 3%; font: 650 clamp(9.5px, 6.6cqw, 11px) var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 22% }
.g-reset { margin-top: 4px; line-height: 1.3 }
.g-rel { font-size: 13px; font-weight: 620; font-variant-numeric: tabular-nums; letter-spacing: -0.01em }
.g-abs { font-size: 12px; color: var(--muted) }
.g-abs .short { display: none }
@container (max-width: 150px) {
    .g-abs .long { display: none }
    .g-abs .short { display: inline }
}
.g-note { font: 11px var(--mono); color: var(--faint) }
.g-cool { margin: 1px 0 }
.seg-trk { stroke: var(--track) }
.seg-fill { transition: stroke-dasharray 0.9s var(--ease), stroke-dashoffset 0.9s var(--ease) }
.seg-fill.held { opacity: 0.38 }
.g-res { stroke: #17171a80 }
.g-pace { fill: var(--muted) }

/* Accounts */
.accts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line) }
.acct { padding: 13px 0 14px; border-bottom: 1px solid var(--line) }
.acct:last-child { border-bottom: 0 }
.acct-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0 }
.sw { display: inline-grid; place-items: center; width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--c) }
.sw.rank { width: 18px; height: 18px; font: 700 10.5px/1 var(--mono); color: #fff }
.acct-label { min-width: 0; max-width: 100%; font-weight: 620; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.acct-plan { font: 11.5px var(--mono); color: var(--muted) }
.chip { font: 550 10.5px var(--mono); letter-spacing: 0.04em; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.chip-ok { color: var(--ok); background: #10884621 }
.chip-warn { color: var(--warn); background: #bb690021 }
.chip-bad { color: var(--bad); background: #c52c2a21 }
.cells { row-gap: 12px; margin-top: 11px }
.cell { container-type: inline-size; min-width: 0 }
.cell-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font: 11.5px var(--mono); color: var(--muted); white-space: nowrap }
.cell-top > span { overflow: hidden; text-overflow: ellipsis }
.cell-v b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums }
.cell.hot .cell-v b { color: var(--warn) }
.cell.full .cell-v b { color: var(--bad) }
.cell-k { color: var(--text) }
.cell-res { color: var(--faint) }
.cell-res.hit { color: var(--warn) }
.bar { position: relative; height: 7px; margin: 6px 0 5px; border-radius: 99px; background: var(--track); overflow: hidden }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--c); transition: left 0.9s var(--ease), width 0.9s var(--ease) }
.bar > i.held { opacity: 0.4 }
.bar > .zone {
    position: absolute;
    inset: 0 auto 0 0;
    background: repeating-linear-gradient(-45deg, #ffffffb2 0 1.5px, transparent 1.5px 4px);
    box-shadow: inset -1.5px 0 0 #17171ab2;
}
.bar > b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); opacity: 0.45; transition: left 0.9s var(--ease) }
.cell-reset { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.cell-reset b { color: var(--text); font-weight: 560 }
@container (max-width: 150px) { .cell-reset .abs { display: none } }
.cell.is-empty .cell-v { color: var(--faint) }
.acct-note { margin: 9px 0 0; font: 11.5px var(--mono); color: var(--warn); overflow-wrap: anywhere }
.acct-note.bad { color: var(--bad) }
.acct.is-disabled { opacity: 0.55 }
.acct.is-stale .cells { opacity: 0.72 }

/* Reset popover */
.pop {
    position: absolute;
    inset: auto;
    margin: 0;
    width: min(360px, calc(100vw - 24px));
    max-height: min(70vh, 520px);
    overflow: auto;
    padding: 0;
    border: 1px solid var(--line-2);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 18px 48px -12px #00000040;
}
.pop:popover-open { animation: pop 0.18s var(--ease) both }
.pop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 10px 0 16px }
.pop-head h3 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -0.015em }
.pop-head .btn { width: 28px; height: 28px }
.pop-desc { margin: 2px 16px 0; font-size: 12px; color: var(--muted) }
.pop-list { list-style: none; margin: 10px 0 0; padding: 0 }
.pop-item { padding: 11px 16px; border-top: 1px solid var(--line) }
.pop-row { display: flex; align-items: center; gap: 10px }
.pop-txt { flex: 1; min-width: 0 }
.pop-label { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pop-sub { font: 11.5px var(--mono); color: var(--muted) }
.pop-item .btn { height: 30px; font-size: 12.5px }
.pop-item .confirm, .pop-item .outcome { margin-top: 10px }
.confirm {
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--pc-edge);
    background: var(--pc-soft);
    animation: pop 0.22s var(--ease) both;
}
.confirm p { margin: 0 0 10px; font-size: 12.5px }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px }
.outcome { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: var(--surface-2); animation: pop 0.22s var(--ease) both }
.outcome::before { content: ""; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--faint); flex: none }
.outcome.ok { background: #1088461c }
.outcome.ok::before { background: var(--ok) }
.outcome.warn { background: #bb69001c }
.outcome.warn::before { background: var(--warn) }
.outcome.bad { background: #c52c2a1c }
.outcome.bad::before { background: var(--bad) }
.outcome-body { flex: 1; min-width: 0 }
.outcome-body small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px }
.outcome-acts { display: flex; justify-content: flex-end; gap: 6px; flex: 1 0 100% }
.outcome .btn { height: 28px; font-size: 12px }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) } }
.locked { padding: 42px 20px; text-align: center; border-radius: 18px; border: 1px dashed var(--line-2); color: var(--muted) }
.locked h3 { margin: 0 0 6px; color: var(--text); font-size: 17px; letter-spacing: -0.02em }
.locked p { margin: 0 0 16px }

/* Edit mode */
.sec-head .controls .btn svg { width: 14px; height: 14px }
.edit-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 14px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 14px; background: var(--surface-2) }
.edit-tools p { margin: 0; font-size: 12.5px; color: var(--muted) }
.edit-tools b { color: var(--text); font-weight: 620 }
.edit-hint { flex: 1 1 260px }
.edit-help { flex: 1 0 100%; font-size: 12px; line-height: 1.55 }
.acct-tools { display: inline-flex; align-items: center; gap: 4px; margin-left: auto }
.acct-tools .btn.mini { width: 26px; height: 26px; border-radius: 7px }
.acct-tools .btn.mini svg { width: 14px; height: 14px }
.grip { display: grid; place-items: center; width: 26px; height: 28px; border-radius: 7px; color: var(--faint); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none }
.grip:hover { background: var(--surface-2); color: var(--text) }
.grip svg { width: 12px; height: 16px }
.pri, .res-in { display: inline-flex; align-items: center; gap: 5px; font: 11.5px var(--mono); color: var(--muted); white-space: nowrap }
.num-in { width: 54px; height: 26px; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); font: 12px var(--mono); font-variant-numeric: tabular-nums; text-align: right }
.num-in.changed { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus) }
.num-in:disabled { opacity: 0.6 }
.res-in .num-in { width: 50px; height: 22px }
.acct.is-dragging { position: relative; z-index: 3; background: var(--surface); border-radius: 10px; box-shadow: 0 12px 30px -10px #00000055; cursor: grabbing }
.acct.is-dragging .grip { cursor: grabbing }
.acct.drop-before { box-shadow: inset 0 2px 0 var(--focus) }
.acct.drop-after { box-shadow: inset 0 -2px 0 var(--focus) }
body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing }
body.is-dragging * { cursor: grabbing !important }
.bar-edit { position: relative; margin: 6px 0 5px; touch-action: none; cursor: ew-resize }
.bar-edit .bar { margin: 0 }
.bar-edit::before { content: ""; position: absolute; inset: -8px 0 }
.thumb { position: absolute; top: -5px; bottom: -5px; width: 16px; margin-left: -8px; cursor: ew-resize; z-index: 1 }
.thumb::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 2px var(--surface) }
.thumb:focus-visible { outline: none }
.thumb:focus-visible::before { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--focus) }
.is-editing .bar > i, .is-editing .bar > b { transition: none }
.is-editing .cell-top { flex-wrap: wrap; row-gap: 4px }
.is-editing .cell-top > .cell-v { overflow: visible; flex: none }
.is-editing .cell-top > .res-in { margin-left: auto }
.is-editing .seg-fill { transition-duration: 0.12s }
.savebar { position: sticky; bottom: 12px; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--surface); box-shadow: 0 14px 34px -12px #00000050 }
.save-status { display: inline-flex; align-items: center; gap: 8px; font: 12.5px var(--mono); color: var(--muted) }
.save-acts { display: flex; gap: 8px; margin-left: auto }
.save-notice { flex: 1 0 100%; order: 3; padding: 9px 12px; border-radius: 10px; font-size: 12.5px; background: #c52c2a14; border: 1px solid #c52c2a59 }
.save-notice.warn { background: #bb690014; border-color: #bb690059 }
.save-notice ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font: 11.5px var(--mono); overflow-wrap: anywhere }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.tile { position: relative; padding: 14px 16px 15px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0 }
.tile-k { font: 550 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted) }
.tile-v { margin: 9px 0 6px; font: 640 clamp(22px, 2.7vw, 33px)/1.05 var(--mono); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile-s { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center }
.tile-meter { display: flex; height: 4px; margin: 0 0 8px; border-radius: 99px; overflow: hidden; background: var(--track) }
.tile-meter i { display: block; height: 100%; transition: width 0.7s var(--ease) }
.pill { font: 500 11.5px var(--mono); padding: 3px 9px; border-radius: 99px; white-space: nowrap }
.pill-unpriced { color: var(--warn); background: #bb69001f; font-size: 10.5px; padding: 2px 7px }

/* Legend / filters */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 0 }
.legend-k { font: 550 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin-right: 6px }
.lg {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 28px;
    padding: 0 11px 0 9px;
    border-radius: 99px;
    border: 1px solid var(--line);
    background: var(--surface);
    font: 11.5px var(--mono);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
}
.lg:hover { border-color: var(--line-2) }
.lg i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); transition: background 0.15s }
.lg[aria-pressed="false"] { color: var(--faint); background: transparent; text-decoration: line-through; text-decoration-color: var(--line-2) }
.lg[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c) }
.lg em { font-style: normal; color: var(--warn); font-size: 10px }
.lg-reset { height: 28px; font-size: 12px }

/* Chart panels */
.panel { margin-top: 12px; padding: 16px 16px 10px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow) }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; margin-bottom: 10px }
.panel-title { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.panel-title .mono { font-size: 12px; font-weight: 450; color: var(--muted); letter-spacing: 0 }
.panel-note { font: 11.5px var(--mono); color: var(--muted) }
.panel-note.warn { color: var(--warn) }
.loading .chart-svg, .loading .tiles, .loading .tbl-wrap { opacity: 0.5; transition: opacity 0.2s }
.chart { position: relative; border-radius: 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none }
.chart:focus-visible { outline-offset: 4px }
.chart-svg { transition: opacity 0.25s }
.chart svg { display: block; overflow: visible }
.chart .tick line { stroke: var(--line) }
.chart .tick.zero line { stroke: var(--line-2) }
.chart text { fill: var(--faint); font: 10.5px var(--mono); font-variant-numeric: tabular-nums }
.chart .tick { transition: transform 0.55s var(--ease); animation: fade 0.45s both }
.chart .xl { animation: fade 0.45s both }
.bar-r {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transition: x 0.55s var(--ease), y 0.55s var(--ease), width 0.55s var(--ease), height 0.55s var(--ease), opacity 0.3s;
    animation: grow 0.6s var(--ease) var(--d, 0ms) both;
}
.bar-r.partial { opacity: 0.62 }
@keyframes grow { from { transform: scaleY(0) } }
@keyframes fade { from { opacity: 0 } }
.chart-empty { position: absolute; inset: 0 0 26px 52px; display: grid; place-items: center; font: 12px var(--mono); color: var(--faint); pointer-events: none }
.band-hl, .xhair { position: absolute; pointer-events: none }
.band-hl { background: #17171a0f; border-radius: 3px }
.xhair { width: 1px; background: var(--text); opacity: 0.4 }
.tip {
    position: absolute;
    z-index: 5;
    top: 0;
    left: 0;
    min-width: 190px;
    max-width: 270px;
    padding: 9px 11px;
    border-radius: 11px;
    border: 1px solid var(--line-2);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 34px -10px #00000040;
    pointer-events: none;
    font-size: 12px;
}
.tip-h { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-weight: 620 }
.tip-h span { color: var(--muted); font-weight: 450; font-size: 11px }
.tip-r { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 1.5px 0; font: 11.5px var(--mono) }
.tip-r i { width: 8px; height: 8px; border-radius: 2px; background: var(--c) }
.tip-r span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tip-r b { font-weight: 560; font-variant-numeric: tabular-nums }
.tip-t { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); font-weight: 650 }

.sk { border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 30%, #e4e4e7 50%, var(--surface-2) 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite }
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: 0 0 } }

/* Table */
.tbl-wrap { overflow-x: auto; margin: 0 -4px }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px }
.tbl th { padding: 8px 10px; text-align: left; font: 550 10.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
.tbl tbody tr:last-child td { border-bottom: 0 }
.tbl tfoot td { border-top: 1px solid var(--line-2); border-bottom: 0; font-weight: 650 }
.tbl .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums }
.tbl .rank { width: 1%; color: var(--faint); font: 11.5px var(--mono) }
.tbl tr.is-hidden td { opacity: 0.42 }
.m-name { display: flex; align-items: center; gap: 9px; font-weight: 560 }
.m-name i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none }
.prov-tag { font: 11.5px var(--mono); color: var(--muted) }
.share { display: flex; align-items: center; gap: 9px; min-width: 130px }
.share-bar { flex: 1; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden }
.share-bar i { display: block; height: 100%; border-radius: inherit; background: var(--c); transition: width 0.7s var(--ease) }
.share span { width: 3.4em; text-align: right; font: 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.unpriced { font: 550 10.5px var(--mono); color: var(--warn) }

footer { margin-top: 34px; font: 11.5px/1.6 var(--mono); color: var(--faint) }

/* Auth dialog */
dialog {
    width: min(420px, calc(100vw - 32px));
    padding: 24px;
    border-radius: 20px;
    border: 1px solid var(--line-2);
    background: var(--surface);
    color: var(--text);

}
dialog::backdrop { background: #ffffff8c; backdrop-filter: blur(6px) }
dialog[open] { animation: pop 0.25s var(--ease) both }
dialog h2 { margin: 14px 0 6px; font-size: 21px; letter-spacing: -0.03em }
dialog p { margin: 0 0 16px; color: var(--muted); font-size: 13.5px }
dialog label { display: block; margin-bottom: 6px; font: 550 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted) }
dialog input { width: 100%; height: 42px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--bg-2); font: 14px var(--mono) }
dialog input:focus-visible { outline-offset: 0 }
.auth-err { margin: 10px 0 0; color: var(--bad); font-size: 13px }
.auth-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px }

@media (max-width: 860px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 640px) {
    .prov { padding: 16px 14px 2px; border-radius: 16px }
    .tbl .col-prov, .tbl .col-req { display: none }

    .panel { padding: 14px 12px 8px; border-radius: 16px }

}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0ms !important;
        transition-duration: 0.001ms !important;
    }
}
</style>

</dialog>

<script type="module">
const KEY_STORAGE = "cpa-usage-management-key"
const PREFS_STORAGE = "cpa-usage-prefs"
const MGMT = "/v8/management"
const API = `${MGMT}/observability/usage`
const DEMO = new URLSearchParams(location.search).get("demo") === "1"
const MIN = 60_000
const HOUR = 3_600_000
const DAY = 86_400_000
// Each preset pairs a lookback with the bucket size that keeps its chart readable.
const RANGES = {
    "1h": { gran: "minute", n: 60, label: "Last hour" },
    "24h": { gran: "hour", n: 24, label: "Last 24 hours" },
    "7d": { gran: "hour", n: 168, label: "Last 7 days" },
    "30d": { gran: "day", n: 30, label: "Last 30 days" },
    "90d": { gran: "day", n: 90, label: "Last 90 days" },
    "1y": { gran: "month", n: 12, label: "Last 12 months" },
}
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)")

const $ = (sel, root = document) => root.querySelector(sel)
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])
const round = (n, d = 1) => Math.round(n * 10 ** d) / 10 ** d

// ---------- Formatting (browser locale, English copy) ----------

const LOCALE = navigator.languages?.length ? [...navigator.languages] : undefined
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone
const nf = new Intl.NumberFormat(LOCALE)
const nf1 = new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 1 })
const pctFmt = new Intl.NumberFormat(LOCALE, { style: "percent", maximumFractionDigits: 0 })
const pct1Fmt = new Intl.NumberFormat(LOCALE, { style: "percent", maximumFractionDigits: 1 })
const usd2 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", currencyDisplay: "narrowSymbol" })
const usd0 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", currencyDisplay: "narrowSymbol", maximumFractionDigits: 0 })
const usd3 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", currencyDisplay: "narrowSymbol", maximumFractionDigits: 3 })
const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: "auto" })
const rtfN = new Intl.RelativeTimeFormat(LOCALE, { numeric: "always", style: "narrow" })
const df = (opts) => new Intl.DateTimeFormat(LOCALE, opts)
const fTime = df({ hour: "2-digit", minute: "2-digit" })
const fDayMonth = df({ day: "numeric", month: "long" })
const fDayMonthYear = df({ day: "numeric", month: "long", year: "numeric" })
const fWeekDay = df({ weekday: "short", day: "numeric", month: "long" })
const fDayShort = df({ day: "numeric", month: "short" })
const fWeekDayShort = df({ weekday: "short", day: "numeric", month: "short" })
const fWeekDayLong = df({ weekday: "long", day: "numeric", month: "long" })
const fMonth = df({ month: "short" })
const fMonthYear = df({ month: "short", year: "numeric" })
const fMonthYearLong = df({ month: "long", year: "numeric" })

function fmtTok(n) {
    const a = Math.abs(n)
    if (a >= 1e9) return nf1.format(n / 1e9) + "B"
    if (a >= 1e6) return nf1.format(n / 1e6) + "M"
    if (a >= 1e3) return nf1.format(n / 1e3) + "K"
    return nf.format(Math.round(n))
}
const fmtUsd = (n) => (n > 0 && n < 0.01 ? usd3 : usd2).format(n)
const fmtUsdAxis = (n) => (n >= 10 ? usd0 : usd2).format(n)
const fmtPct = (p) => pctFmt.format(p / 100)

function pctParts(p) {
    return pctFmt.formatToParts(p / 100)
        .map((part) => (part.type === "percentSign" ? `<small>${esc(part.value)}</small>` : esc(part.value)))
        .join("")
}

function dayDiff(d, now = new Date()) {
    const a = new Date(d.getFullYear(), d.getMonth(), d.getDate())
    const b = new Date(now.getFullYear(), now.getMonth(), now.getDate())
    return Math.round((a - b) / DAY)
}

// "23:10 · 18 ottobre", with today/tomorrow/weekday for near dates.
function absTime(iso) {
    const d = new Date(iso)
    if (Number.isNaN(+d)) return ""
    const diff = dayDiff(d)
    let day
    if (diff === 0 || diff === 1 || diff === -1) day = rtf.format(diff, "day")
    else if (diff > 1 && diff < 7) day = fWeekDay.format(d)
    else if (d.getFullYear() !== new Date().getFullYear()) day = fDayMonthYear.format(d)
    else day = fDayMonth.format(d)
    return `${fTime.format(d)} · ${day}`
}

// Compact absolute time: "16:34", or "29 ott, 21:10" for other days.
function absShort(iso) {
    const d = new Date(iso)
    if (Number.isNaN(+d)) return ""
    return dayDiff(d) === 0 ? fTime.format(d) : `${fDayShort.format(d)}, ${fTime.format(d)}`
}

function swapNumber(parts, text) {
    let done = false
    return parts.map((p) => {
        if (p.type === "literal") return p.value
        if (done) return ""
        done = true
        return text
    }).join("")
}

// Relative time that stays readable: "in 34 min", "in 2:34 h", "in 4.3 days".
function relTime(iso, now = Date.now()) {
    const t = new Date(iso).getTime()
    if (Number.isNaN(t)) return ""
    const diff = t - now
    const sign = diff < 0 ? -1 : 1
    const s = Math.abs(diff) / 1000
    if (s < 45) return rtfN.format(sign * Math.max(1, Math.round(s)), "second")
    if (s < 3600) return rtfN.format(sign * Math.round(s / 60), "minute")
    if (s < 86400) {
        const h = Math.floor(s / 3600)
        const m = Math.floor((s % 3600) / 60)
        return swapNumber(rtfN.formatToParts(sign * 2, "hour"), `${h}:${String(m).padStart(2, "0")}`)
    }
    const d = s / 86400
    return rtfN.format(sign * (d < 10 ? round(d, 1) : Math.round(d)), "day")
}

// ---------- Colors ----------

// Plain hex instead of oklch() so extensions such as Dark Reader can parse the colors
const okl = (l, c, h) => {
    const a = c * Math.cos((h * Math.PI) / 180)
    const b = c * Math.sin((h * Math.PI) / 180)
    const l3 = (l + 0.3963377774 * a + 0.2158037573 * b) ** 3
    const m3 = (l - 0.1055613458 * a - 0.0638541728 * b) ** 3
    const s3 = (l - 0.0894841775 * a - 1.291485548 * b) ** 3
    const lin = [
        4.0767416621 * l3 - 3.3077115913 * m3 + 0.2309699292 * s3,
        -1.2684380046 * l3 + 2.6097574011 * m3 - 0.3413193965 * s3,
        -0.0041960863 * l3 - 0.7034186147 * m3 + 1.707614701 * s3,
    ]
    return "#" + lin.map((v) => {
        const x = Math.min(1, Math.max(0, v))
        const g = x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055
        return Math.round(g * 255).toString(16).padStart(2, "0")
    }).join("")
}
const ld = (l, c, h, dl = 0.13) => okl(l - dl, c, h)

const FAMILIES = [
    { test: /opus/, l: 0.72, c: 0.17, h: 40 },
    { test: /sonnet/, l: 0.8, c: 0.14, h: 66 },
    { test: /haiku/, l: 0.87, c: 0.1, h: 92 },
    { test: /claude/, l: 0.66, c: 0.13, h: 22 },
    { test: /codex.*(mini|nano)/, l: 0.84, c: 0.11, h: 180 },
    { test: /codex/, l: 0.76, c: 0.13, h: 222 },
    { test: /^(gpt|o\d)/, l: 0.7, c: 0.15, h: 272 },
    { test: /gemini/, l: 0.78, c: 0.14, h: 150 },
]
const familyUse = new Map()
const colorCache = new Map()

function modelColor(provider, model) {
    const key = `${provider}/${model}`
    if (colorCache.has(key)) return colorCache.get(key)
    const name = String(model).toLowerCase()
    let fam = FAMILIES.findIndex((f) => f.test.test(name))
    let base = FAMILIES[fam]
    if (!base) {
        const cool = provider === "codex"
        base = provider === "claude" ? { l: 0.7, c: 0.12, h: 30 } : cool ? { l: 0.74, c: 0.1, h: 240 } : { l: 0.74, c: 0.03, h: 260 }
        fam = `x-${provider}`
    }
    const n = familyUse.get(fam) ?? 0
    familyUse.set(fam, n + 1)
    const color = ld(base.l - n * 0.08, base.c, base.h + n * 9)
    colorCache.set(key, color)
    return color
}

// Account shades inside a provider, matching the provider accent.
function acctColor(provider, i) {
    if (provider === "claude") return ld(0.76 - (i % 4) * 0.07, 0.15, 48 + (i % 4) * 16, 0.15)
    if (provider === "codex") return ld(0.8 - (i % 4) * 0.06, 0.12, 212 + (i % 4) * 24, 0.16)
    return ld(0.75 - (i % 4) * 0.06, 0.05, 260)
}

const CATS = [
    { label: "Input", tok: "input_tokens", color: ld(0.74, 0.13, 255) },
    { label: "Cache read", tok: "cache_read_tokens", color: ld(0.8, 0.12, 165) },
    { label: "Cache write", tok: "cache_write_tokens", color: ld(0.72, 0.15, 315) },
    { label: "Output", tok: "output_tokens", color: ld(0.82, 0.14, 78) },
]

// ---------- State ----------

function loadPrefs() {
    let raw = {}
    try { raw = JSON.parse(localStorage.getItem(PREFS_STORAGE) || "{}") || {} } catch { raw = {} }
    return {
        range: Object.hasOwn(RANGES, raw.range) ? raw.range : "24h",
        hidden: new Set(Array.isArray(raw.hidden) ? raw.hidden.filter((k) => typeof k === "string") : []),
    }
}
function savePrefs() {
    const { range, hidden } = state.prefs
    localStorage.setItem(PREFS_STORAGE, JSON.stringify({ range, hidden: [...hidden] }))
}

// Claims whose outcome is unknown, keyed by auth_index. Their request ID is
// reused for any later attempt on the same credit, even after a reload, so an
// unanswered claim can never turn into a second redemption.
const PENDING_STORAGE = "cpa-usage-pending-claims"
const PENDING_TTL_MS = 24 * 3600 * 1000
function loadPending() {
    let raw
    try { raw = JSON.parse(localStorage.getItem(PENDING_STORAGE) || "{}") || {} } catch { raw = {} }
    const now = Date.now()
    return new Map(Object.entries(raw).filter(([, c]) => c && c.creditId && c.requestId && now - (c.at || 0) < PENDING_TTL_MS))
}
// Pending claims are shared by every open tab, so each change re-reads storage
// before writing instead of overwriting it with this tab's copy.
function updatePending(id, claim) {
    const fresh = loadPending()
    if (claim) fresh.set(id, claim)
    else fresh.delete(id)
    localStorage.setItem(PENDING_STORAGE, JSON.stringify(Object.fromEntries(fresh)))
    state.pending = fresh
}

function pendingUi(c) {
    return { phase: "done", code: "unconfirmed", message: "A previous reset attempt was not confirmed.", creditId: c.creditId, requestId: c.requestId }
}

// claimFor returns the claim to send for an account: an unresolved claim is
// always retried with its own credit and ID before any new claim is created.
// Web Locks (secure contexts only) serialize tabs; elsewhere the fresh
// storage read narrows the race to near-simultaneous clicks.
async function claimFor(id, credit) {
    const pick = () => {
        const existing = loadPending().get(id)
        if (existing) return existing
        const claim = { creditId: credit, requestId: newRequestId(), at: Date.now() }
        updatePending(id, claim)
        return claim
    }
    if (navigator.locks?.request) return navigator.locks.request("cpa-usage-claims", pick)
    return pick()
}

const state = {
    key: DEMO ? "demo" : localStorage.getItem(KEY_STORAGE) || "",
    prefs: loadPrefs(),
    limits: null,
    limitsAt: 0,
    limitsErr: null,
    history: null,
    historyAt: 0,
    historyErr: null,
    historyFor: null,
    resetUi: new Map(),
    resetPop: null,
    pending: loadPending(),
    hover: null,
    edit: null,
    flash: "",
}
for (const [id, c] of state.pending) {
    if (!c.dismissed) state.resetUi.set(id, pendingUi(c))
}
window.addEventListener("storage", (e) => {
    if (e.key !== PENDING_STORAGE) return
    state.pending = loadPending()
    for (const [id, c] of state.pending) {
        if (!c.dismissed && state.resetUi.get(id)?.phase !== "busy") state.resetUi.set(id, pendingUi(c))
    }
    for (const [id, ui] of state.resetUi) {
        if (ui.code === "unconfirmed" && !state.pending.has(id)) state.resetUi.delete(id)
    }
    renderLimits()
})

// ---------- API ----------

class ApiError extends Error {
    constructor(status, code, message) {
        super(message || code || `HTTP ${status}`)
        this.status = status
        this.code = code
    }
}

async function api(path, init = {}) {
    if (DEMO) return demoApi(path, init)
    if (!state.key) throw new ApiError(401, "signed_out", "No management key")
    let res
    try {
        res = await fetch(path, {
            ...init,
            headers: { Accept: "application/json", Authorization: `Bearer ${state.key}`, ...(init.body ? { "Content-Type": "application/json" } : {}) },
        })
    } catch (err) {
        throw new ApiError(0, "network", "Network error — proxy unreachable")
    }
    let body = null
    try { body = await res.json() } catch { body = null }
    if (res.status === 401) {
        forgetKey("The key was rejected. Enter it again.")
        throw new ApiError(401, "unauthorized", "Unauthorized")
    }
    if (!res.ok) {
        const e = body?.error
        throw new ApiError(res.status, typeof e === "object" ? e?.code : undefined, typeof e === "object" ? e?.message : (body?.message || e || res.statusText))
    }
    return body
}

function historyRange(range, now = new Date()) {
    const { gran, n } = RANGES[range]
    let from
    // Sub-day ranges step in real time so a DST change can't add or drop a bucket.
    if (gran === "minute") from = new Date(+new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes()) - (n - 1) * MIN)
    else if (gran === "hour") from = new Date(+new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours()) - (n - 1) * HOUR)
    else if (gran === "day") from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (n - 1))
    else from = new Date(now.getFullYear(), now.getMonth() - (n - 1), 1)
    return { from: from.toISOString(), to: now.toISOString() }
}

function addGran(d, gran) {
    const x = new Date(d)
    if (gran === "minute") return new Date(+x + MIN)
    if (gran === "hour") return new Date(+x + HOUR)
    if (gran === "day") return new Date(x.getFullYear(), x.getMonth(), x.getDate() + 1)
    return new Date(x.getFullYear(), x.getMonth() + 1, 1)
}

// ---------- Live updates ----------

const liveStream = { controller: null, timer: 0, retries: 0 }

function stopLive() {
    clearTimeout(liveStream.timer)
    liveStream.controller?.abort()
    liveStream.controller = null
}

// Fetch keeps the management key in the Authorization header. EventSource
// cannot set this header and would require putting the credential in the URL.
async function readUsageStream(body, onSnapshot) {
    const reader = body.getReader()
    const decoder = new TextDecoder()
    let buffer = ""
    try {
        for (;;) {
            const { value, done } = await reader.read()
            if (done) break
            buffer += decoder.decode(value, { stream: true })
            let match
            while ((match = /\r?\n\r?\n/.exec(buffer))) {
                const frame = buffer.slice(0, match.index)
                buffer = buffer.slice(match.index + match[0].length)
                const lines = frame.split(/\r?\n/)
                if (!lines.some((line) => line === "event: snapshot")) continue
                const data = lines.filter((line) => line.startsWith("data:")).map((line) => line.slice(5).replace(/^ /, "")).join("\n")
                if (data) onSnapshot(JSON.parse(data))
            }
            if (buffer.length > 8 * 1024 * 1024) throw new Error("Live update exceeded the maximum frame size")
        }
    } finally {
        await reader.cancel().catch(() => {})
        reader.releaseLock()
    }
}

function applyUsageSnapshot(snapshot, range) {
    if (snapshot.limits) {
        state.limits = snapshot.limits
        state.limitsAt = Date.now()
    }
    state.limitsErr = snapshot.limits_error || null
    if (snapshot.history) {
        state.history = snapshot.history
        state.historyFor = range
        state.historyAt = Date.now()
    }
    state.historyErr = snapshot.history_error || null
    $("#activity").classList.remove("loading")
    renderAll()
}

function startLive() {
    stopLive()
    if (!state.key || document.hidden) return
    const controller = new AbortController()
    liveStream.controller = controller
    const range = state.prefs.range
    if (DEMO) {
        loadLimits()
        loadHistory()
        return
    }
    $("#activity").classList.toggle("loading", state.historyFor !== range)
    const qs = new URLSearchParams({ granularity: RANGES[range].gran, buckets: RANGES[range].n, tz: TZ })
    ;(async () => {
        try {
            const res = await fetch(`${API}/stream?${qs}`, {
                headers: { Accept: "text/event-stream", Authorization: `Bearer ${state.key}` },
                signal: controller.signal,
                cache: "no-store",
            })
            if (controller.signal.aborted) return
            if (res.status === 401) { forgetKey("The key was rejected. Enter it again."); return }
            if (!res.ok || !res.headers.get("content-type")?.includes("text/event-stream")) throw new Error(`Live connection failed (HTTP ${res.status})`)
            liveStream.retries = 0
            await readUsageStream(res.body, (snapshot) => {
                if (!controller.signal.aborted) applyUsageSnapshot(snapshot, range)
            })
            throw new Error("Live connection closed; reconnecting")
        } catch (err) {
            if (controller.signal.aborted) return
            state.limitsErr = err.message || "Live connection lost"
            renderLimits()
            const delay = Math.min(30_000, 1000 * 2 ** Math.min(liveStream.retries++, 5))
            liveStream.timer = setTimeout(startLive, delay)
        }
    })()
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopLive()
    else startLive()
})
window.addEventListener("pagehide", stopLive)
window.addEventListener("pageshow", (event) => { if (event.persisted) startLive() })

async function loadLimits() {
    try {
        state.limits = await api(`${API}/limits`)
        state.limitsAt = Date.now()
        state.limitsErr = null
    } catch (err) {
        if (err.status === 401) return
        state.limitsErr = err.message
    }
    renderLimits()
}

let historySeq = 0
async function loadHistory() {
    const range = state.prefs.range
    const seq = ++historySeq
    const { from, to } = historyRange(range)
    const qs = new URLSearchParams({ granularity: RANGES[range].gran, from, to, tz: TZ })
    $("#activity").classList.toggle("loading", state.historyFor !== range)
    try {
        const h = await api(`${API}/history?${qs}`)
        if (seq !== historySeq) return
        state.history = h
        state.historyFor = range
        state.historyAt = Date.now()
        state.historyErr = null
    } catch (err) {
        if (seq !== historySeq || err.status === 401) return
        state.historyErr = err.message
    }
    $("#activity").classList.remove("loading")
    renderActivity()
}

// ---------- DOM morphing (keeps focus and lets CSS transitions run) ----------

function syncAttrs(from, to) {
    for (const a of [...from.attributes]) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name)
    for (const a of to.attributes) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value)
}

function morphChildren(parent, next) {
    const oldKids = [...parent.childNodes]
    const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute("data-key") : null)
    const keyed = new Map()
    const loose = []
    for (const c of oldKids) {
        const k = keyOf(c)
        if (k != null) keyed.set(k, c)
        else loose.push(c)
    }
    let li = 0
    let ref = parent.firstChild
    for (const n of [...next.childNodes]) {
        const k = keyOf(n)
        let match = null
        if (k != null) {
            match = keyed.get(k) ?? null
            if (match && match.nodeName !== n.nodeName) match = null
            if (match) keyed.delete(k)
        } else {
            while (li < loose.length) {
                const c = loose[li++]
                if (c.nodeType === n.nodeType && c.nodeName === n.nodeName) { match = c; break }
                if (c === ref) ref = ref.nextSibling
                c.remove()
            }
        }
        if (match) {
            if (match.nodeType === 1) { syncAttrs(match, n); morphChildren(match, n) }
            else if (match.nodeValue !== n.nodeValue) match.nodeValue = n.nodeValue
            if (match !== ref) parent.insertBefore(match, ref)
            ref = match.nextSibling
        } else {
            parent.insertBefore(n, ref)
            ref = n.nextSibling
        }
    }
    for (const c of keyed.values()) c.remove()
    while (li < loose.length) loose[li++].remove()
}

function patch(el, html) {
    const t = document.createElement("template")
    t.innerHTML = html
    morphChildren(el, t.content)
}

// ---------- Limits ----------

const winKey = (w) => (w.kind === "other" ? `other:${w.label}` : w.kind)
const acctWin = (a, w) => (a.windows || []).find((x) => winKey(x) === winKey(w))
const clampPct = (n) => Math.max(0, Math.min(100, Number(n) || 0))
const leftOf = (w) => clampPct(100 - (Number(w.used_percent) || 0))
// Reserves exist only for the 5h and weekly windows; other windows follow upstream limits.
const RESERVE_FIELD = { five_hour: "quota_5h_remaining_percent", weekly: "quota_weekly_remaining_percent" }
const RESERVE_KEY = { five_hour: "r5", weekly: "rw" }
const reserveOf = (a, w) => (RESERVE_FIELD[w.kind] ? clampPct(a[RESERVE_FIELD[w.kind]]) : 0)
const priorityOf = (a) => Number(a.priority) || 0
const ROUTING_LABEL = { "round-robin": "Round-robin routing", "fill-first": "Fill-first routing · highest priority first", "weighted-round-robin": "Weighted round-robin routing" }
const ROUTING_ALIAS = { rr: "round-robin", roundrobin: "round-robin", wrr: "weighted-round-robin", weightedroundrobin: "weighted-round-robin", ff: "fill-first", fillfirst: "fill-first" }
const routingOf = (s) => {
    const v = String(s ?? "").trim().toLowerCase()
    return ROUTING_LABEL[v] ? v : ROUTING_ALIAS[v] || "round-robin"
}

// accountRows lists accounts in routing order (higher priority first) with a
// stable color, a tier rank when priorities differ, and the fill-first pick.
function accountRows(p) {
    const list = (p.accounts || []).map((a, i) => ({ a, i }))
    list.sort((x, y) => priorityOf(y.a) - priorityOf(x.a) || x.i - y.i)
    const tiers = [...new Set(list.map((x) => priorityOf(x.a)))]
    let active = null
    if (!state.edit && routingOf(state.limits?.routing_strategy) === "fill-first" && list.length > 1) {
        const ready = list.filter((x) => !x.a.disabled && x.a.status === "ok")
        // Equal priorities are ordered by an ID this page doesn't see, so only a clear winner is marked.
        if (ready.length === 1 || (ready.length > 1 && priorityOf(ready[1].a) !== priorityOf(ready[0].a))) active = ready[0].a
    }
    return list.map((x, k) => ({ a: x.a, color: acctColor(p.provider, k), rank: tiers.length > 1 ? tiers.indexOf(priorityOf(x.a)) + 1 : 0, active: x.a === active }))
}

function arcPath(cx, cy, r, a0, a1) {
    const rad = (a) => (a * Math.PI) / 180
    const p = (a) => [cx + r * Math.sin(rad(a)), cy - r * Math.cos(rad(a))]
    const [x0, y0] = p(a0)
    const [x1, y1] = p(a1)
    return `M${round(x0, 2)} ${round(y0, 2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${round(x1, 2)} ${round(y1, 2)}`
}

function gaugeHtml(p, w, rows) {
    // Accounts stack end to end in reverse routing order, so the account used
    // first sits next to the empty stretch and the dial drains like a fuel gauge.
    const enabled = rows.filter((r) => !r.a.disabled)
    const slots = enabled.map((r) => ({ ...r, w: acctWin(r.a, w) })).filter((s) => s.w).reverse()
        .map((s) => ({ ...s, left: leftOf(s.w), reserve: reserveOf(s.a, s.w) }))
    const n = Math.max(1, slots.length)
    const cap = n * 100
    const cx = 60, cy = 60, r = 47, sw = 10
    const outer = r + sw / 2 + 2.5
    const track = arcPath(cx, cy, r, -135, 135)
    const gap = n > 1 ? (2.2 / 270) * cap : 0
    const scale = (cap - gap * (n - 1)) / cap
    const angle = (u) => ((-135 + (270 * u) / cap) * Math.PI) / 180
    const pt = (a, rr) => `${round(cx + rr * Math.sin(a), 2)} ${round(cy - rr * Math.cos(a), 2)}`
    const seg = (cls, u0, u1, color = "", title = "") => `<path class="${cls}" d="${track}" pathLength="100" stroke-width="${sw}" fill="none" style="${color ? `stroke:${color};` : ""}stroke-dasharray:${round((Math.max(0, u1 - u0) / cap) * 100, 2)} 100;stroke-dashoffset:${round((-u0 / cap) * 100, 2)}">${title ? `<title>${esc(title)}</title>` : ""}</path>`
    const line = (u, r0, r1, cls, width, title = "") => {
        const [x1, y1] = pt(angle(u), r0).split(" ")
        const [x2, y2] = pt(angle(u), r1).split(" ")
        return `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${width}">${title ? `<title>${esc(title)}</title>` : ""}</line>`
    }
    let arcs = seg("seg-trk", 0, cap)
    let marks = ""
    let usable = 0
    let held = 0
    let at = 0
    for (const s of slots) {
        if (s.left <= 0) continue
        const keep = Math.min(s.left, s.reserve)
        usable += Math.max(0, s.left - s.reserve)
        held += keep
        const title = `${s.a.label}: ${fmtPct(s.left)} left${s.reserve ? `, routing stops at ${fmtPct(s.reserve)}` : ""}`
        const u = (v) => at + v * scale
        arcs += seg("seg-fill held", u(0), u(keep), s.color, title)
        arcs += seg("seg-fill", u(keep), u(s.left), s.color, title)
        if (s.reserve > 0) marks += line(u(keep), r - sw / 2, r + sw / 2 + 2, "g-res", 1.1, `${s.a.label}: routing stops at ${fmtPct(s.reserve)} left`)
        at = u(s.left) + gap
    }
    // A lone account also gets its even-pace marker; several accounts show it per row.
    const elapsed = slots.length === 1 ? paceAt(slots[0].w) : null
    if (elapsed != null) {
        const a = angle(100 - elapsed)
        const t = [Math.cos(a) * 2.6, Math.sin(a) * 2.6]
        const [bx, by] = pt(a, outer + 5.5).split(" ").map(Number)
        marks += `<path class="g-pace" d="M${pt(a, outer + 0.5)}L${round(bx + t[0], 2)} ${round(by + t[1], 2)}L${round(bx - t[0], 2)} ${round(by - t[1], 2)}Z"><title>Even pace through the window</title></path>`
    }
    const anyReserve = slots.some((s) => s.reserve > 0)
    const tone = usable <= 0 ? "full" : usable / cap < 0.15 ? "hot" : ""
    const capText = `${anyReserve ? "usable" : "left"}${n > 1 ? ` of ${fmtPct(cap)}` : ""}`
    const reset = w.next_reset_at
    const note = slots.length < enabled.length ? `${slots.length} of ${enabled.length} reporting` : ""
    // Once every account is out of usable quota, routing resumes when the first
    // one comes back: at its cooldown end, or else when its window resets.
    const exhausted = slots.length > 0 && slots.every((s) => s.left <= s.reserve)
    const cool = exhausted ? slots.map((s) => ({ a: s.a, until: (s.a.status === "cooldown" && s.a.cooldown_until) || s.w.resets_at }))
        .filter((c) => c.until && !Number.isNaN(new Date(c.until).getTime()))
        .sort((x, y) => new Date(x.until) - new Date(y.until)).slice(0, 1) : []
    const coolLine = (c) => `<div class="g-cool"><span class="chip chip-warn" title="${esc(c.a.label)} is usable again ${esc(absTime(c.until))}">Cooldown <span data-rel="${esc(c.until)}">${esc(relTime(c.until))}</span></span></div>`
    // The cooldown replaces the reset line when both end together.
    const merged = reset && cool.length && Math.abs(new Date(cool[0].until).getTime() - new Date(reset).getTime()) < 2 * MIN
    const aria = `${p.label} ${w.label}: ${fmtPct(usable)} ${capText}${held > 0 ? `, plus ${fmtPct(held)} kept in reserve` : ""}${reset ? `, next reset ${relTime(reset)}` : ""}${cool.length ? `, cooldown ends ${relTime(cool[0].until)}` : ""}`
    return `<div class="gauge" data-key="g-${esc(winKey(w))}">
        <div class="g-dial">
            <svg viewBox="0 0 120 106" role="img" aria-label="${esc(aria)}">${arcs}${marks}</svg>
            <div class="g-center" aria-hidden="true"><div class="g-val ${tone}">${pctParts(usable)}</div><div class="g-cap">${esc(capText)}</div>${held >= 0.5 ? `<div class="g-held">+${esc(fmtPct(held))} reserved</div>` : ""}</div>
            <div class="g-label" aria-hidden="true" title="${esc(w.label)}">${esc(w.label)}</div>
        </div>
        <div class="g-reset">${reset ? `${merged ? coolLine(cool[0]) : `<div class="g-rel" data-rel="${esc(reset)}">${esc(relTime(reset))}</div>`}<div class="g-abs"><span class="long">${esc(absTime(reset))}</span><span class="short">${esc(absShort(reset))}</span></div>${cool.slice(merged ? 1 : 0).map(coolLine).join("")}` : `<div class="g-abs">no reset time</div>${cool.map(coolLine).join("")}`}${note ? `<div class="g-note">${esc(note)}</div>` : ""}</div>
    </div>`
}

function paceAt(w, now = Date.now()) {
    const mins = Number(w.window_minutes)
    const t = new Date(w.resets_at).getTime()
    if (!mins || Number.isNaN(t)) return null
    const elapsed = 1 - (t - now) / (mins * MIN)
    return elapsed > 0 && elapsed < 1 ? elapsed * 100 : null
}

function cellHtml(a, w) {
    const left = leftOf(w)
    const reserve = reserveOf(a, w)
    const usable = left - reserve
    const tone = left <= 0 ? " full" : usable < 15 ? " hot" : ""
    const elapsed = paceAt(w)
    const label = w.kind === "other" ? `<span class="cell-k" title="${esc(w.label)}">${esc(w.label)}</span>` : ""
    const stop = reserve ? `<span class="cell-res${usable <= 0 ? " hit" : ""}" title="Routing skips this account once ${esc(fmtPct(reserve))} is left">${usable <= 0 ? "stopped" : "stops"} at ${esc(fmtPct(reserve))}</span>` : ""
    const aria = `${w.label}: ${fmtPct(left)} left${reserve ? `, routing stops at ${fmtPct(reserve)}` : ""}`
    const key = state.edit && RESERVE_KEY[w.kind]
    const bar = `<div class="bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${round(left, 1)}" aria-label="${esc(aria)}"><i class="held" style="width:${round(Math.min(left, reserve), 2)}%"></i><i style="left:${round(reserve, 2)}%;width:${round(Math.max(0, usable), 2)}%"></i>${reserve ? `<span class="zone" style="width:${round(reserve, 2)}%"></span>` : ""}${elapsed != null ? `<b style="left:${round(100 - elapsed, 2)}%" title="Even pace"></b>` : ""}</div>`
    return `<div class="cell${tone}" data-key="w-${esc(winKey(w))}">
        <div class="cell-top">${label}<span class="cell-v"><b>${esc(fmtPct(left))}</b> left</span>${key ? reserveInputHtml(a, w, key, reserve) : stop}</div>
        ${key ? reserveBarHtml(a, w, key, reserve, bar) : bar}
        <div class="cell-reset">${w.resets_at ? `<b data-rel="${esc(w.resets_at)}">${esc(relTime(w.resets_at))}</b><span class="abs"> · ${esc(absShort(w.resets_at))}</span>` : "no reset time"}</div>
    </div>`
}

function accountHtml(row, wins, single, cols, sharedError, ctx = {}) {
    const { a, color, rank, active } = row
    const chips = []
    const ed = state.edit
    if (active) chips.push(`<span class="chip chip-ok" title="Fill-first routing sends new requests here">In use</span>`)
    if (a.disabled || a.status === "disabled") chips.push(`<span class="chip">Disabled</span>`)
    if (a.status === "cooldown") chips.push(`<span class="chip chip-warn"${a.cooldown_until ? ` title="Until ${esc(absTime(a.cooldown_until))}"` : ""}>Cooldown${a.cooldown_until ? ` <span data-rel="${esc(a.cooldown_until)}">${esc(relTime(a.cooldown_until))}</span>` : ""}</span>`)
    if (a.limit_reached) chips.push(`<span class="chip chip-warn" title="Routing skips this account until a window resets">Reserve reached</span>`)
    // A single account's 5h and weekly windows are already on the dials.
    const cells = single ? [] : wins.map((w) => {
        const aw = acctWin(a, w)
        return aw ? cellHtml(a, aw) : `<div class="cell is-empty" data-key="w-${esc(winKey(w))}"><div class="cell-top"><span class="cell-v">No data</span></div></div>`
    })
    for (const w of a.windows || []) if (!wins.some((x) => winKey(x) === winKey(w))) cells.push(cellHtml(a, w))
    let note = ""
    if (a.error && a.error !== sharedError) note = a.error + (a.source === "headers" ? " Showing the last values seen in responses." : "")
    const saveError = ed?.errors.get(a.auth_index) || ""
    const sw = rank
        ? `<span class="sw rank" title="Priority ${esc(priorityOf(a))}" aria-hidden="true">${rank}</span><span class="sr">Routing order ${rank}, priority ${esc(priorityOf(a))}.</span>`
        : `<span class="sw" aria-hidden="true"></span>`
    const dragging = ed?.drag?.id === a.auth_index
    const cls = ["acct", a.disabled || a.status === "disabled" ? "is-disabled" : "", a.error || a.status === "error" ? "is-stale" : "", dragging ? "is-dragging" : "", ctx.drop ? `drop-${ctx.drop}` : ""].filter(Boolean).join(" ")
    const lift = dragging ? `;transform:translateY(${round(ed.drag.dy, 1)}px)` : ""
    return `<li class="${cls}" data-key="a-${esc(a.auth_index)}" data-prov="${esc(ctx.provider || "")}" style="--c:${color}${lift}">
        <div class="acct-head">${sw}<span class="acct-label" title="${esc(a.label)}">${esc(a.label)}</span>${a.plan ? `<span class="acct-plan">${esc(a.plan)}</span>` : ""}${chips.join("")}${ed ? accountToolsHtml(a, ctx) : ""}</div>
        ${cells.length ? `<div class="cells" style="--cols:${cols}">${cells.join("")}</div>` : ""}
        ${note ? `<p class="acct-note${a.source === "headers" ? "" : " bad"}">${esc(note)}</p>` : ""}
        ${saveError ? `<p class="acct-note bad" role="alert">Not saved: ${esc(saveError)}</p>` : ""}
    </li>`
}

const OUTCOMES = {
    reset: { tone: "ok", text: "Reset redeemed. Windows refreshed." },
    nothing_to_reset: { tone: "", text: "Upstream reported nothing to reset." },
    already_redeemed: { tone: "warn", text: "This credit was already redeemed." },
    no_credit: { tone: "warn", text: "No reset credit is available for this account." },
}
// Errors that prove the claim was not applied. Anything else, including
// network failures and unknown codes, may have landed and keeps its request ID.
const DEFINITIVE_ERRORS = new Set(["rate_limited", "cooling_down", "signed_out", "not_found", "invalid_request", "upstream_failed"])
const ERRORS = {
    rate_limited: "Rate limited by upstream. Try again shortly.",
    cooling_down: "The account is cooling down. Try again later.",
    unconfirmed: "Upstream didn't confirm the redemption. Retrying uses the same credit.",
    signed_out: "The account is signed out. Re-authenticate it in the proxy.",
    not_found: "Account or credit not found.",
    invalid_request: "The proxy rejected the request.",
    upstream_failed: "The upstream request failed.",
}

function describeOutcome(ui) {
    if (ui.outcome) {
        const o = OUTCOMES[ui.outcome] || { tone: "", text: `Outcome: ${ui.outcome}` }
        return { ...o, detail: ui.warning || "" }
    }
    const text = ERRORS[ui.code] || "The reset failed."
    const detail = ui.message && ui.message !== text ? ui.message : ""
    return { tone: "bad", text, detail, retry: !DEFINITIVE_ERRORS.has(ui.code) }
}

const providerKind = (p) => (p.provider === "claude" || p.provider === "codex" ? p.provider : "other")

function resetButtonHtml(p, rows) {
    const resets = Number(p.resets_available) || 0
    const uis = rows.map((r) => state.resetUi.get(r.a.auth_index)).filter(Boolean)
    const busy = uis.some((u) => u.phase === "busy")
    const alert = uis.some((u) => u.phase === "done")
    const text = busy ? "Redeeming…" : resets > 0 ? `${nf.format(resets)} reset${resets > 1 ? "s" : ""}` : "No resets"
    return `<button class="reset-btn${resets > 0 ? " has" : ""}${alert ? " alert" : ""}" type="button" data-action="resets" data-provider="${esc(p.provider)}" data-focus="resets-${esc(p.provider)}" aria-haspopup="dialog" aria-controls="reset-pop" aria-expanded="${state.resetPop === p.provider}"${alert ? ` title="A reset attempt has a result to review"` : ""}>${busy ? `<span class="spin" aria-hidden="true"></span>` : ""}${esc(text)}<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button>`
}

function resetPopHtml(p, rows) {
    const items = rows.map(({ a, color }) => {
        const r = a.resets
        const ui = state.resetUi.get(a.auth_index)
        const id = esc(a.auth_index)
        const sub = !r ? "Credits not reported" : !r.available ? "No credits" : `${nf.format(r.available)} credit${r.available > 1 ? "s" : ""}${r.next_expires_at ? ` · expires ${absShort(r.next_expires_at)}` : ""}`
        let act = ""
        if (ui?.phase === "busy") act = `<button class="btn btn-accent" type="button" disabled><span class="spin" aria-hidden="true"></span>Redeeming…</button>`
        else if (r?.available && r.next_credit_id && !a.disabled && ui?.phase !== "confirm") act = `<button class="btn btn-accent" type="button" data-action="reset-open" data-id="${id}" data-focus="open-${id}">Use reset</button>`
        let msg = ""
        if (ui?.phase === "confirm") {
            msg = `<div class="confirm" role="group" aria-label="Confirm reset">
                <p>Use a reset credit on <b>${esc(a.label)}</b>? This can't be undone.</p>
                <div class="confirm-actions">

                    <button class="btn btn-commit" type="button" data-action="reset-confirm" data-id="${id}">Redeem</button>

        } else if (ui?.phase === "done") {

            msg = `<div class="outcome ${o.tone}" role="status">

        <div class="pop-head"><h3 id="reset-pop-title">${esc(p.label || p.provider)} resets</h3><button class="btn btn-icon btn-ghost" type="button" data-action="resets-close" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></div>
        <p class="pop-desc">A credit resets one account's usage windows right away.</p>
        <ul class="pop-list">${items.join("")}</ul>

}

function providerHtml(p) {
    const rows = accountRows(state.edit ? { ...p, accounts: (p.accounts || []).map(viewAccount) } : p)
    const wins = p.windows || []
    const cols = wins.length || 2
    const errors = rows.map((r) => r.a.error).filter(Boolean)
    // The same failure on every account (a provider-wide rate limit) is shown once.
    const shared = errors.length > 1 && errors.length === rows.length && errors.every((e) => e === errors[0]) ? errors[0] : ""
    const sharedNote = shared && rows.every((r) => r.a.source === "headers") ? `${shared} Showing the last values seen in responses.` : shared
    const n = p.account_count ?? rows.length
    return `<article class="prov prov-${providerKind(p)}" data-key="p-${esc(p.provider)}" aria-labelledby="pn-${esc(p.provider)}">
        <header class="prov-head">
            <h3 class="prov-name" id="pn-${esc(p.provider)}"><span class="prov-glyph" aria-hidden="true"></span>${esc(p.label || p.provider)}</h3>

function renderLimits() {
    const body = $("#limits-body")
    const notice = $("#limits-notice")
    renderEditUi()
    if (!state.key) {

    if (!state.limits) {
        hideResetPop()
        patch(notice, state.limitsErr ? `<div class="notice bad">Couldn't load limits: ${esc(state.limitsErr)}</div>` : "")
        if (!state.limitsErr) patch(body, [0, 1].map((i) => `<div class="prov" data-key="sk${i}"><div class="sk" style="height:22px;width:40%"></div><div class="sk" style="height:150px;margin:18px 0"></div><div class="sk" style="height:60px;margin-bottom:14px"></div></div>`).join(""))
        else patch(body, "")
        return
    }
    patch(notice, (state.limitsErr ? `<div class="notice" data-key="err">Couldn't refresh limits: ${esc(state.limitsErr)}. Showing the last data.</div>` : "") + (state.flash ? `<div class="notice ok" data-key="flash" role="status">${esc(state.flash)}</div>` : ""))
    const providers = state.limits.providers || []
    patch(body, providers.length ? providers.map(providerHtml).join("") : `<div class="locked" data-key="empty"><h3>No accounts</h3><p>No Claude or Codex OAuth accounts are configured.</p></div>`)
    $("#limits-meta").textContent = ROUTING_LABEL[state.edit ? state.edit.routing : routingOf(state.limits.routing_strategy)]
    renderResetPop()
    syncEditInputs()
}

// ---------- Reset popover ----------

// The popover lives outside the morphed card markup so its open state and
// position survive every limits refresh.
const resetPop = $("#reset-pop")
const resetPopOpen = () => resetPop.matches(":popover-open")
const resetPopProvider = () => (state.limits?.providers || []).find((x) => x.provider === state.resetPop)

function renderResetPop() {
    const p = resetPopProvider()
    if (!p) return hideResetPop()
    patch(resetPop, resetPopHtml(p, accountRows(p)))
    placeResetPop()
}

function placeResetPop() {
    const btn = state.resetPop && document.querySelector(`[data-focus="resets-${CSS.escape(state.resetPop)}"]`)
    if (!btn || !resetPopOpen()) return
    const b = btn.getBoundingClientRect()
    const vw = document.documentElement.clientWidth
    const left = Math.max(12, Math.min(vw - resetPop.offsetWidth - 12, b.right - resetPop.offsetWidth))
    resetPop.style.left = `${Math.round(left + scrollX)}px`
    resetPop.style.top = `${Math.round(b.bottom + 8 + scrollY)}px`
}

function hideResetPop() {
    state.resetPop = null
    if (resetPopOpen()) resetPop.hidePopover()
}

function openResetPop(id) {
    state.resetPop = id
    renderLimits()
    if (!state.resetPop) return
    if (!resetPopOpen()) resetPop.showPopover()
    placeResetPop()
    ;(resetPop.querySelector('[data-action="reset-retry"]') || resetPop.querySelector('[data-action="reset-open"]') || resetPop.querySelector("button"))?.focus()
}

function closeResetPop(focus) {
    const id = state.resetPop
    if (!id) return
    const p = resetPopProvider()
    hideResetPop()
    // Keep running claims and failures that still offer a retry; drop the rest.
    for (const a of p?.accounts || []) {
        const ui = state.resetUi.get(a.auth_index)
        if (ui?.phase === "confirm" || (ui?.phase === "done" && !describeOutcome(ui).retry)) state.resetUi.delete(a.auth_index)
    }
    renderLimits()
    if (focus) document.querySelector(`[data-focus="resets-${CSS.escape(id)}"]`)?.focus()
}

document.addEventListener("pointerdown", (e) => {
    if (state.resetPop && !e.target.closest("#reset-pop, [data-action='resets']")) closeResetPop()
})
window.addEventListener("resize", placeResetPop)

// ---------- Reset flow ----------

function setResetUi(id, ui, focus) {
    if (ui) state.resetUi.set(id, ui)
    else state.resetUi.delete(id)
    renderLimits()
    if (focus) document.querySelector(`[data-focus="${CSS.escape(focus)}"]`)?.focus()
}

function findAccount(id) {
    for (const p of state.limits?.providers || []) for (const a of p.accounts || []) if (a.auth_index === id) return a
    return null
}

// randomUUID needs a secure context; plain-HTTP LAN access only has getRandomValues.
function newRequestId() {
    if (crypto.randomUUID) return crypto.randomUUID()
    return Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("")
}

// requestId is the claim's idempotency key: a retry of the same claim reuses it.
async function redeem(id, creditId, requestId) {
    setResetUi(id, { phase: "busy", creditId, requestId })
    updatePending(id, { creditId, requestId, at: Date.now() })
    let ui
    try {
        const res = await api(`${API}/limits/reset`, { method: "POST", body: JSON.stringify({ auth_index: id, credit_id: creditId, request_id: requestId }) })
        ui = Object.hasOwn(OUTCOMES, res?.outcome)
            ? { phase: "done", outcome: res.outcome, warning: res.warning || "", creditId, requestId }
            : { phase: "done", code: "unconfirmed", message: "The proxy returned an unrecognized reset result.", creditId, requestId }
    } catch (err) {
        if (err.status === 401) {
            state.resetUi.set(id, { phase: "done", code: "unconfirmed", message: "Sign in again, then retry the same credit.", creditId, requestId })
            return
        }
        ui = { phase: "done", code: err.code || "unconfirmed", message: err.message, creditId, requestId }
    }
    if (ui.outcome || DEFINITIVE_ERRORS.has(ui.code)) updatePending(id, null)
    state.resetUi.set(id, ui)
    await loadLimits()
    const next = document.querySelector(`[data-focus="retry-${CSS.escape(id)}"]`) || document.querySelector(`[data-focus="dismiss-${CSS.escape(id)}"]`)
    next?.focus()
}

function onLimitsClick(e) {
    const btn = e.target.closest("[data-action]")
    if (!btn) return
    const id = btn.dataset.id
    switch (btn.dataset.action) {
        case "unlock": openAuth(); break
        case "edit-start": startEdit(); break
        case "edit-cancel": cancelEdit(); break
        case "edit-save": saveEdit(); break
        case "move-up": moveRow(id, -1); break
        case "move-down": moveRow(id, 1); break
        case "resets": {
            const provider = btn.dataset.provider
            if (state.resetPop === provider) closeResetPop(true)
            else {
                closeResetPop()
                openResetPop(provider)
            }
            break
        }
        case "resets-close": closeResetPop(true); break
        case "reset-open": {
            // One confirmation at a time, so Escape always backs out of the visible one.
            for (const [k, ui] of state.resetUi) if (ui.phase === "confirm") state.resetUi.delete(k)
            setResetUi(id, { phase: "confirm" }, `cancel-${id}`)
            break
        }
        case "reset-cancel": setResetUi(id, null, `open-${id}`); break
        case "reset-dismiss": {
            // Keep an unresolved claim's request ID for reuse; just stop showing it.
            const pending = loadPending().get(id)
            if (pending) updatePending(id, { ...pending, dismissed: true })
            setResetUi(id, null, `open-${id}`)
            break
        }
        case "reset-confirm": {
            const credit = findAccount(id)?.resets?.next_credit_id
            const pending = loadPending().get(id)
            if (!credit && !pending) {
                setResetUi(id, { phase: "done", code: "not_found", message: "No credit id is known for this account." })
                break
            }
            claimFor(id, credit).then((claim) => redeem(id, claim.creditId, claim.requestId))
            break
        }
        case "reset-retry": {
            const ui = state.resetUi.get(id)
            if (ui?.creditId) redeem(id, ui.creditId, ui.requestId || newRequestId())
            break
        }
    }
}
$("#limits").addEventListener("click", onLimitsClick)
resetPop.addEventListener("click", onLimitsClick)

// ---------- Edit mode ----------

// Routing strategy, account priority and per-window reserves are edited as a
// draft over the live data and saved through the v8 config and credential APIs.
// Reserves are the percentage a window must still have left; 0 disables one.
const ROUTING = [
    { value: "round-robin", label: "Round-robin", hint: "Rotates through the accounts of the highest available priority tier." },
    { value: "weighted-round-robin", label: "Weighted", hint: "Rotates within the highest available tier, favoring accounts with a higher weight." },
    { value: "fill-first", label: "Fill-first", hint: "Keeps using the first account of the highest available tier until it is unavailable." },
]
const DRAFT_FIELD = { priority: "priority", r5: "quota_5h_remaining_percent", rw: "quota_weekly_remaining_percent" }
const MAX_PRIORITY = 1_000_000

const allAccounts = () => (state.limits?.providers || []).flatMap((p) => p.accounts || [])
const valsOf = (a) => ({ priority: Math.trunc(priorityOf(a)), r5: reserveField(a, "r5"), rw: reserveField(a, "rw") })
const reserveField = (a, key) => clampPct(a[DRAFT_FIELD[key]])

function startEdit() {
    if (!state.limits || state.edit) return
    const draft = new Map()
    const base = new Map()
    for (const a of allAccounts()) {
        draft.set(a.auth_index, valsOf(a))
        base.set(a.auth_index, valsOf(a))
    }
    const routing = routingOf(state.limits.routing_strategy)
    state.flash = ""
    state.edit = { draft, base, routing, baseRouting: routing, ids: new Map(), errors: new Map(), busy: null, notice: null, drag: null, cancelDrag: null, announce: "" }
    renderLimits()
    document.querySelector('#routing-ctl input:checked')?.focus()
}

function cancelEdit() {
    const ed = state.edit
    if (!ed || ed.busy) return
    ed.cancelDrag?.()
    state.edit = null
    renderLimits()
    document.querySelector('[data-focus="edit-start"]')?.focus()
}

// viewAccount overlays the draft on an account so dials, bars and order preview
// the edit before it is saved.
function viewAccount(a) {
    const v = state.edit.draft.get(a.auth_index)
    if (!v) return a
    const out = { ...a, priority: v.priority, quota_5h_remaining_percent: v.r5, quota_weekly_remaining_percent: v.rw }
    out.limit_reached = (a.windows || []).some((w) => {
        const r = reserveOf(out, w)
        return r > 0 && leftOf(w) <= r
    })
    return out
}

// editDiff lists what differs from the values last read or saved. Only changed
// fields are sent, so an untouched legacy reserve keeps its stored form.
function editDiff(ed) {
    const accounts = []
    let count = 0
    for (const a of allAccounts()) {
        const d = ed.draft.get(a.auth_index)
        const b = ed.base.get(a.auth_index)
        if (!d || !b) continue
        const patch = {}
        const set = {}
        for (const key of Object.keys(DRAFT_FIELD)) {
            if (d[key] === b[key]) continue
            patch[DRAFT_FIELD[key]] = d[key]
            set[key] = d[key]
            count++
        }
        if (Object.keys(set).length) accounts.push({ a, patch, set })
    }
    const routing = ed.routing !== ed.baseRouting ? ed.routing : ""
    if (routing) count++
    return { routing, accounts, count }
}

function dirtyOf(key, id) {
    const d = state.edit?.draft.get(id)
    const b = state.edit?.base.get(id)
    return !!d && !!b && d[key] !== b[key]
}

const ICONS = {

    down: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>`,
    grip: `<svg viewBox="0 0 12 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="3" r="1.2"/><circle cx="8.5" cy="3" r="1.2"/><circle cx="3.5" cy="8" r="1.2"/><circle cx="8.5" cy="8" r="1.2"/><circle cx="3.5" cy="13" r="1.2"/><circle cx="8.5" cy="13" r="1.2"/></svg>`,
    pencil: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3.5 12.5 5.5M3 13l.5-2.5L11 3a1.4 1.4 0 0 1 2 2l-7.5 7.5z"/></svg>`,
}

function accountToolsHtml(a, ctx) {
    const id = esc(a.auth_index)
    const busy = state.edit.busy ? " disabled" : ""
    const move = (action, icon, text, off) => `<button class="btn btn-ghost btn-icon mini" type="button" data-action="${action}" data-id="${id}" data-focus="${action}-${id}" aria-label="${esc(text)}"${off || busy ? " disabled" : ""}>${icon}</button>`

    </span>`
