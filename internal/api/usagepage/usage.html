function reserveInputHtml(a, w, key, reserve) {
    const id = esc(a.auth_index)
    return `<label class="res-in" title="Routing skips this account once this much of the window is left. 0 turns the reserve off.">stop at <input class="num-in${dirtyOf(key, a.auth_index) ? " changed" : ""}" type="number" inputmode="decimal" min="0" max="100" step="any" data-edit="${key}" data-id="${id}" value="${round(reserve, 1)}" aria-label="${esc(a.label)} ${esc(w.label)}: routing stops at this percent left, 0 disables"${state.edit.busy ? " disabled" : ""}>%</label>`

function reserveBarHtml(a, w, key, reserve, bar) {

    const text = reserve ? `routing stops at ${fmtPct(reserve)} left` : "no reserve"
    return `<div class="bar-edit" data-id="${id}" data-field="${key}">${bar}<span class="thumb" role="slider" tabindex="0" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${round(reserve, 1)}" aria-valuetext="${esc(text)}" aria-label="${esc(a.label)} ${esc(w.label)} reserve, percent left" data-id="${id}" data-field="${key}" style="left:${round(reserve, 2)}%"></span></div>`
}

// dropSide marks where a row drag would land among the other rows.
function dropSide(provider, rows, row) {
    const drag = state.edit?.drag
    if (!drag || drag.provider !== provider) return ""
    const others = rows.filter((r) => r.a.auth_index !== drag.id)
    if (!others.length || drag.to === rows.findIndex((r) => r.a.auth_index === drag.id)) return ""
    if (drag.to < others.length) return others[drag.to] === row ? "before" : ""
    return others[others.length - 1] === row ? "after" : ""
}

// ----- Toolbar and save bar -----

function editCount() {
    return state.edit ? editDiff(state.edit).count : 0
}

function renderEditUi() {
    const ed = state.edit && state.key && state.limits ? state.edit : null
    $("#limits").classList.toggle("is-editing", !!ed)
    patch($("#limits-actions"), state.key && state.limits && !ed ? `<button class="btn" type="button" data-action="edit-start" data-focus="edit-start" data-key="edit-start">${ICONS.pencil}Edit</button>` : "")
    patch($("#limits-tools"), ed ? editToolsHtml(ed) : "")
    patch($("#limits-edit"), ed ? saveBarHtml(ed) : "")
}

function editToolsHtml(ed) {
    const cur = ROUTING.find((r) => r.value === ed.routing) || ROUTING[0]

function saveBarHtml(ed) {

    const status = ed.busy
        ? `<span class="spin" aria-hidden="true"></span>Saving ${ed.busy.done} of ${ed.busy.total}…`

        </div>
        ${note}
        <span class="sr" role="status" aria-live="polite">${esc(ed.announce)}</span>

}

// Uncontrolled inputs keep what the user typed; this restores the draft into
// the ones that are not being edited, e.g. after Cancel or a failed entry.
function syncEditInputs() {
    for (const el of document.querySelectorAll("#limits [data-edit]")) {
        if (el.type === "radio") el.checked = el.hasAttribute("checked")
        else if (el !== document.activeElement) el.value = el.getAttribute("value") ?? ""
    }
}

let editFrame = 0
function scheduleEditRender() {
    if (editFrame) return
    editFrame = requestAnimationFrame(() => {
        editFrame = 0
        if (state.edit) renderLimits()
    })
}

// ----- Draft changes -----

function setDraft(id, key, value) {
    const ed = state.edit
    const v = ed?.draft.get(id)
    if (!v || ed.busy) return
    v[key] = value
    ed.errors.delete(id)
    if (ed.notice?.tone === "warn") ed.notice = null
    ed.retry = ed.retry && ed.errors.size > 0
}

// assignTiers gives each group of accounts (listed best first) a strictly
// lower priority than the one above, keeping every value that still fits.
// Groups with a null preference take the free integers around them. Returns
// null when there is no room, so the caller can renumber the whole provider.
function assignTiers(groups) {
    const vals = []
    let last = Infinity
    for (const g of groups) {
        if (g.pref != null && g.pref < last) {
            vals.push(g.pref)
            last = g.pref
        } else vals.push(null)
    }
    for (let i = 0; i < vals.length;) {
        if (vals[i] != null) { i++; continue }
        let j = i
        while (j < vals.length && vals[j] == null) j++
        const k = j - i
        const hi = i > 0 ? vals[i - 1] : Infinity
        const lo = j < vals.length ? vals[j] : -1
        const top = hi === Infinity ? lo + k : hi - 1
        if (top - (k - 1) <= lo) return null
        for (let m = 0; m < k; m++) vals[i + m] = top - m
        i = j
    }
    return vals
}

const draftPriority = (a) => state.edit.draft.get(a.auth_index)?.priority ?? priorityOf(a)

function providerOrder(provider) {
    const p = (state.limits?.providers || []).find((x) => x.provider === provider)
    return (p?.accounts || []).map((a, i) => ({ a, i })).sort((x, y) => draftPriority(y.a) - draftPriority(x.a) || x.i - y.i).map((x) => x.a)
}

// reorderTo moves one account to `to` among the others. The moved account
// becomes its own tier; accounts that shared a tier and stay adjacent keep
// sharing it, and priorities that still fit are not touched.
function reorderTo(provider, id, to) {
    const ed = state.edit
    const order = providerOrder(provider)
    const from = order.findIndex((a) => a.auth_index === id)
    if (from < 0) return false
    const [moved] = order.splice(from, 1)
    const at = Math.max(0, Math.min(order.length, to))
    if (at === from) return false
    order.splice(at, 0, moved)
    const groups = []
    for (const a of order) {
        const pref = a === moved ? null : draftPriority(a)
        const last = groups[groups.length - 1]
        if (pref != null && last && last.pref === pref) last.ids.push(a.auth_index)
        else groups.push({ ids: [a.auth_index], pref })
    }
    let vals = assignTiers(groups)
    if (!vals) {
        const floor = Math.max(0, Math.min(...order.map(draftPriority)))
        vals = groups.map((_, i) => floor + groups.length - 1 - i)
    }
    groups.forEach((g, i) => { for (const gid of g.ids) setDraft(gid, "priority", vals[i]) })
    ed.announce = `Moved ${moved.label} to position ${at + 1} of ${order.length}.`
    return true
}

function moveRow(id, delta) {
    const ed = state.edit
    const a = allAccounts().find((x) => x.auth_index === id)
    if (!ed || ed.busy || !a) return
    const provider = (state.limits.providers || []).find((p) => (p.accounts || []).includes(a))?.provider
    const from = providerOrder(provider).findIndex((x) => x.auth_index === id)
    reorderTo(provider, id, from + delta)
    renderLimits()
    const btn = document.querySelector(`[data-focus="${delta < 0 ? "move-up" : "move-down"}-${CSS.escape(id)}"]:not(:disabled)`) || document.querySelector(`[data-focus="${delta < 0 ? "move-down" : "move-up"}-${CSS.escape(id)}"]:not(:disabled)`)
    btn?.focus()
}

// ----- Pointer dragging -----

// trackPointer follows one pointer on the window, since the dragged markup is
// re-rendered while it moves. The returned function ends the drag early.
function trackPointer(pointerId, onMove, onEnd) {
    let done = false
    const stop = (ok) => {
        if (done) return
        done = true
        window.removeEventListener("pointermove", move)
        window.removeEventListener("pointerup", up)
        window.removeEventListener("pointercancel", cancel)
        document.body.classList.remove("is-dragging")
        onEnd(ok)
    }
    const move = (e) => { if (e.pointerId === pointerId) onMove(e) }
    const up = (e) => { if (e.pointerId === pointerId) stop(true) }
    const cancel = (e) => { if (e.pointerId === pointerId) stop(false) }
    window.addEventListener("pointermove", move)
    window.addEventListener("pointerup", up)
    window.addEventListener("pointercancel", cancel)
    document.body.classList.add("is-dragging")
    return () => stop(false)
}

function startReserveDrag(e, wrap) {
    const ed = state.edit
    const { id, field } = wrap.dataset
    e.preventDefault()
    wrap.querySelector(".thumb")?.focus({ preventScroll: true })
    const set = (clientX) => {
        const r = wrap.getBoundingClientRect()
        if (!r.width) return
        setDraft(id, field, Math.round(clampPct(((clientX - r.left) / r.width) * 100)))
        scheduleEditRender()
    }
    set(e.clientX)
    ed.cancelDrag = trackPointer(e.pointerId, (ev) => set(ev.clientX), () => {
        ed.cancelDrag = null
        renderLimits()
    })
}

function startRowDrag(e, grip) {
    const ed = state.edit
    const { drag: id, provider } = grip.dataset
    const rows = [...document.querySelectorAll(`#limits-body li.acct[data-prov="${CSS.escape(provider)}"]`)]
    const li = grip.closest("li.acct")
    const others = rows.filter((x) => x !== li)
    const mids = others.map((x) => { const r = x.getBoundingClientRect(); return r.top + r.height / 2 + scrollY })
    const from = rows.indexOf(li)
    if (from < 0) return
    e.preventDefault()
    const startY = e.clientY + scrollY
    let y = e.clientY
    let raf = 0
    ed.drag = { id, provider, dy: 0, to: from }
    const update = () => {
        const docY = y + scrollY
        ed.drag.dy = docY - startY
        ed.drag.to = mids.filter((m) => m < docY).length
        scheduleEditRender()
    }
    // Hold near the viewport edge to keep scrolling.
    const scroll = () => {
        const dy = y < 56 ? -14 : y > innerHeight - 56 ? 14 : 0
        if (dy) { scrollBy(0, dy); update() }
        raf = requestAnimationFrame(scroll)
    }
    raf = requestAnimationFrame(scroll)
    ed.cancelDrag = trackPointer(e.pointerId, (ev) => { y = ev.clientY; update() }, (ok) => {
        cancelAnimationFrame(raf)
        const drag = ed.drag
        ed.drag = null
        ed.cancelDrag = null
        if (ok && drag.to !== from) reorderTo(provider, id, drag.to)
        renderLimits()
    })
    update()
}

$("#limits").addEventListener("pointerdown", (e) => {
    const ed = state.edit
    if (!ed || ed.busy || ed.cancelDrag || e.button > 0) return
    const grip = e.target.closest(".grip[data-drag]")
    if (grip) return startRowDrag(e, grip)
    const wrap = e.target.closest(".bar-edit")
    if (wrap) startReserveDrag(e, wrap)
})

$("#limits").addEventListener("keydown", (e) => {
    const thumb = e.target.closest?.(".thumb")
    if (!thumb || !state.edit || state.edit.busy) return
    const { id, field } = thumb.dataset
    const cur = state.edit.draft.get(id)?.[field]
    if (cur == null) return
    const step = e.shiftKey ? 10 : 1
    const next = { ArrowLeft: cur - step, ArrowDown: cur - step, ArrowRight: cur + step, ArrowUp: cur + step, PageDown: cur - 10, PageUp: cur + 10, Home: 0, End: 100 }[e.key]
    if (next == null) return
    e.preventDefault()
    setDraft(id, field, round(clampPct(next), 1))
    renderLimits()
})

$("#limits").addEventListener("change", (e) => {
    const el = e.target.closest?.("[data-edit]")
    const ed = state.edit
    if (!el || !ed || ed.busy) return
    const key = el.dataset.edit
    if (key === "routing") {
        ed.routing = el.value
        renderLimits()
        return
    }
    const id = el.dataset.id
    const cur = ed.draft.get(id)
    if (!cur) return
    const raw = el.value.trim()
    const n = key === "priority" ? Number(raw) : raw === "" ? 0 : Number(raw)
    const ok = key === "priority" ? raw !== "" && Number.isInteger(n) && n >= 0 && n <= MAX_PRIORITY : Number.isFinite(n) && n >= 0 && n <= 100
    if (!ok) {
        ed.notice = { tone: "warn", text: key === "priority" ? "Priority must be a whole number from 0 up." : "A reserve is the percent left, from 0 to 100. Use 0 to turn it off.", items: [] }
        el.value = String(cur[key])
        renderLimits()
        return
    }
    setDraft(id, key, key === "priority" ? n : round(n, 1))
    renderLimits()
})

window.addEventListener("beforeunload", (e) => {
    if (editCount() > 0) e.preventDefault()
})

// ----- Saving -----

async function credentialId(authIndex) {
    const res = await api(`${MGMT}/credentials?${new URLSearchParams({ auth_index: authIndex })}`)
    const file = (res?.files || []).find((f) => f.auth_index === authIndex)
    if (!file?.id) throw new ApiError(404, "not_found", "Credential not found")
    return file.id
}

// The strategy and each account are separate requests, so a save can partly
// succeed. Saved values become the new baseline and failures stay in the draft
// for another try. Signing out clears the draft, which ends the loop quietly.
async function saveEdit() {
    const ed = state.edit
    if (!ed || ed.busy) return
    const { routing, accounts, count } = editDiff(ed)
    if (!count) return
    const total = (routing ? 1 : 0) + accounts.length
    const live = () => state.edit === ed
    const failed = []
    ed.retry = false
    ed.busy = { done: 0, total }
    ed.errors.clear()
    ed.notice = null
    ed.announce = ""
    renderLimits()
    if (routing) {
        try {
            await api(`${MGMT}/config/routing/strategy`, { method: "PUT", body: JSON.stringify(routing) })
            if (!live()) return
            ed.baseRouting = routing
        } catch (err) {
            if (!live()) return
            failed.push(`Routing strategy: ${err.message}`)
        }
        ed.busy.done++
        renderLimits()
    }
    for (const { a, patch: body, set } of accounts) {
        try {
            let name = ed.ids.get(a.auth_index)
            if (!name) {
                name = await credentialId(a.auth_index)
                if (!live()) return
                ed.ids.set(a.auth_index, name)
            }
            await api(`${MGMT}/credentials/fields`, { method: "PATCH", body: JSON.stringify({ name, ...body }) })
            if (!live()) return
            Object.assign(ed.base.get(a.auth_index), set)
        } catch (err) {
            if (!live()) return
            ed.errors.set(a.auth_index, err.message)
            failed.push(`${a.label}: ${err.message}`)
        }
        ed.busy.done++
        renderLimits()
    }
    ed.busy = null
    if (failed.length) {
        ed.retry = true
        ed.notice = { tone: "bad", text: `${total - failed.length} of ${total} saved. The rest is kept here, so you can retry.`, items: failed }
        ed.announce = `${failed.length} changes could not be saved.`
        renderLimits()
        return
    }
    state.edit = null
    state.flash = "Saved. Routing uses the new settings now."
    renderLimits()
    document.querySelector('[data-focus="edit-start"]')?.focus()
    loadLimits()
    setTimeout(() => {
        state.flash = ""
        renderLimits()
    }, 5000)
}

// ---------- Activity ----------

const seriesKey = (s) => `${s.provider}/${s.model}`

function modelList(h) {
    const list = (h?.models || []).map((m) => ({ ...m, key: seriesKey(m), color: modelColor(m.provider, m.model) }))
    const known = new Set(list.map((m) => m.key))
    for (const b of h?.buckets || []) for (const s of b.series || []) {
        const k = seriesKey(s)
        if (!known.has(k)) { known.add(k); list.push({ ...s, key: k, color: modelColor(s.provider, s.model) }) }
    }
    return list
}

function deriveChart(h, metric) {
    const hidden = state.prefs.hidden
    const keys = modelList(h)
        .filter((m) => !hidden.has(m.key) && (metric === "tokens" || m.priced !== false))
        .sort((a, b) => (metric === "tokens" ? b.total_tokens - a.total_tokens : b.cost_usd - a.cost_usd))
        .map((m) => ({ key: m.key, label: m.model, color: m.color }))
    const gran = h.granularity || RANGES[state.historyFor].gran
    const now = Date.now()
    const raw = h.buckets || []
    const buckets = raw.map((b, i) => {
        const start = new Date(b.start)
        const end = raw[i + 1] ? new Date(raw[i + 1].start) : addGran(start, gran)
        const vals = {}
        let unpriced = 0
        for (const s of b.series || []) {
            const k = seriesKey(s)
            if (hidden.has(k)) continue
            if (metric === "cost" && s.priced === false) {
                unpriced += s.total_tokens || 0
                continue
            }
            vals[k] = (vals[k] || 0) + (Number(metric === "tokens" ? s.total_tokens : s.cost_usd) || 0)
        }
        const total = Object.values(vals).reduce((a, v) => a + v, 0)
        return { t: +start, start, end, vals, total, unpriced, partial: +end > now }
    })
    return { gran, range: RANGES[state.historyFor].label, keys, buckets, metric, fmt: metric === "tokens" ? fmtTok : fmtUsd, axis: metric === "tokens" ? fmtTok : fmtUsdAxis }
}

function niceScale(max) {
    if (!(max > 0)) return { top: 1, step: 1, empty: true }
    const raw = max / 4
    const mag = 10 ** Math.floor(Math.log10(raw))
    const norm = raw / mag
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag
    return { top: Math.ceil(max / step) * step, step }
}

function xTicks(gran, buckets, width) {
    const target = Math.max(2, Math.floor(width / 78))
    const n = buckets.length
    const steps = { minute: [5, 10, 15, 30, 60, 120], hour: [1, 2, 3, 6, 12, 24, 48, 72], day: [1, 2, 3, 5, 7, 10, 15, 30], month: [1, 2, 3, 4, 6] }[gran]
    let step = steps[steps.length - 1]
    for (const s of steps) {
        if (n / s <= target) { step = s; break }
    }
    const out = []
    buckets.forEach((b, i) => {
        const d = b.start
        let on
        if (gran === "minute") on = (d.getHours() * 60 + d.getMinutes()) % step === 0
        else if (gran === "hour") on = step <= 24 ? d.getHours() % step === 0 : d.getHours() === 0 && Math.round((d - new Date(d.getFullYear(), 0, 1)) / DAY) % (step / 24) === 0
        else if (gran === "day") on = (n - 1 - i) % step === 0
        else on = d.getMonth() % step === 0 || step === 1
        if (on) out.push(i)
    })
    return out
}

function xLabel(gran, d) {
    if (gran === "minute") return d.getHours() === 0 && d.getMinutes() === 0 ? fDayShort.format(d) : fTime.format(d)
    if (gran === "hour") return d.getHours() === 0 ? fDayShort.format(d) : fTime.format(d)
    if (gran === "day") return fDayShort.format(d)
    return d.getMonth() === 0 ? fMonthYear.format(d) : fMonth.format(d)
}

function bucketTitle(gran, b) {
    if (gran === "minute") return `${fWeekDayShort.format(b.start)} · ${fTime.format(b.start)}`
    if (gran === "hour") return `${fWeekDayShort.format(b.start)} · ${fTime.format(b.start)}–${fTime.format(b.end)}`
    if (gran === "day") return fWeekDayLong.format(b.start)
    return fMonthYearLong.format(b.start)
}

class Chart {
    constructor(el, name, label) {
        this.el = el
        this.name = name
        this.label = label
        this.data = null
        this.layout = null
        el.tabIndex = 0
        el.setAttribute("role", "group")
        el.setAttribute("aria-roledescription", "chart")
        el.innerHTML = `<div class="chart-svg"></div><div class="band-hl" hidden></div><div class="xhair" hidden></div><div class="tip" hidden aria-hidden="true"></div><span class="sr" aria-live="polite"></span>`
        this.svgEl = $(".chart-svg", el)
        this.band = $(".band-hl", el)
        this.xhair = $(".xhair", el)
        this.tip = $(".tip", el)
        this.live = $(".sr", el)
        el.addEventListener("pointermove", (e) => this.onPointer(e))
        el.addEventListener("pointerdown", (e) => this.onPointer(e))
        el.addEventListener("pointerleave", (e) => { if (e.pointerType !== "touch") setHover(null) })
        el.addEventListener("keydown", (e) => this.onKey(e))
        el.addEventListener("blur", () => { if (state.hover?.src === this.name) setHover(null) })
    }

    setData(d) {
        this.data = d
        this.render()
    }

    render() {
        const d = this.data
        const W = Math.max(260, Math.floor(this.el.clientWidth))
        const narrow = W < 560
        const H = narrow ? 210 : 264
        if (!d) {
            patch(this.svgEl, `<div class="sk" data-key="sk" style="height:${H}px"></div>`)
            this.layout = null
            return
        }
        const m = { l: narrow ? 40 : 52, r: 4, t: 12, b: 26 }
        const pw = W - m.l - m.r
        const ph = H - m.t - m.b
        const n = d.buckets.length || 1
        const max = d.buckets.reduce((a, b) => Math.max(a, b.total), 0)
        const sc = niceScale(max)
        const yv = (v) => m.t + ph - (v / sc.top) * ph
        const band = pw / n
        const gap = band > 8 ? band * 0.26 : band > 3.2 ? 1 : band > 1.6 ? 0.4 : 0
        const bw = Math.max(0.6, band - gap)
        let grid = ""
        if (!sc.empty) {
            for (let v = 0; v <= sc.top + sc.step / 2; v += sc.step) {
                const vv = round(v, 6)
                grid += `<g class="tick${vv === 0 ? " zero" : ""}" data-key="y${vv}" style="transform:translateY(${round(yv(vv), 2)}px)"><line x1="${m.l}" x2="${W - m.r}" y1="0" y2="0"/><text x="${m.l - 8}" y="0" dy="0.32em" text-anchor="end">${esc(vv === 0 ? "0" : d.axis(vv))}</text></g>`
            }
        } else {
            grid = `<g class="tick zero" data-key="y0" style="transform:translateY(${m.t + ph}px)"><line x1="${m.l}" x2="${W - m.r}" y1="0" y2="0"/></g>`
        }
        let xl = ""
        for (const i of xTicks(d.gran, d.buckets, pw)) {
            const b = d.buckets[i]
            const x = m.l + (i + 0.5) * band
            const anchor = i === 0 && x - m.l < 24 ? "start" : "middle"
            xl += `<text class="xl" data-key="x${b.t}" x="${round(x, 2)}" y="${H - 8}" text-anchor="${anchor}">${esc(xLabel(d.gran, b.start))}</text>`
        }
        const delayStep = reducedMotion.matches ? 0 : Math.min(8, 420 / n)
        let bars = ""
        d.buckets.forEach((b, i) => {
            let cum = 0
            const x = round(m.l + i * band + (band - bw) / 2, 2)
            for (const k of d.keys) {
                const v = b.vals[k.key] || 0
                if (v <= 0) continue
                const y0 = yv(cum)
                const y1 = yv(cum + v)
                cum += v
                let h = y0 - y1
                const shave = h > 3 && bw > 3 ? 1 : 0
                h = round(Math.max(0.5, h - shave), 2)
                const y = round(y1 + shave, 2)
                bars += `<rect class="bar-r${b.partial ? " partial" : ""}" data-key="${b.t}|${esc(k.key)}" x="${x}" y="${y}" width="${round(bw, 2)}" height="${h}" style="x:${x}px;y:${y}px;width:${round(bw, 2)}px;height:${h}px;fill:${k.color};--d:${round(i * delayStep)}ms"/>`
            }
        })
        const total = d.buckets.reduce((a, b) => a + b.total, 0)
        const peak = d.buckets.reduce((a, b) => (b.total > a.total ? b : a), d.buckets[0] || { total: 0 })
        const aria = `${this.label}, ${d.range.toLowerCase()} by ${d.gran}. Total ${d.fmt(total)}${peak?.total ? `, peak ${d.fmt(peak.total)} at ${bucketTitle(d.gran, peak)}` : ""}.`
        patch(this.svgEl, `<svg data-key="svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><g>${grid}</g><g>${bars}</g><g>${xl}</g></svg>${total ? "" : `<div class="chart-empty" data-key="empty">No activity in this range</div>`}`)
        this.el.setAttribute("aria-label", `${this.label} chart. Use left and right arrow keys to inspect buckets.`)
        this.layout = { m, W, H, pw, ph, band, n }
        if (state.hover) this.showHover(state.hover.idx, state.hover.src === this.name)
    }

    idxFromEvent(e) {
        const L = this.layout
        if (!L) return null
        const x = e.clientX - this.el.getBoundingClientRect().left
        if (x < L.m.l - 4 || x > L.W) return null
        return Math.max(0, Math.min(L.n - 1, Math.floor((x - L.m.l) / L.band)))
    }

    onPointer(e) {
        const idx = this.idxFromEvent(e)
        setHover(idx == null ? null : { idx, src: this.name })
    }

    onKey(e) {
        const L = this.layout
        if (!L || !this.data) return
        const cur = state.hover?.src === this.name ? state.hover.idx : null
        const lastActive = (() => {
            for (let i = L.n - 1; i >= 0; i--) if (this.data.buckets[i]?.total > 0) return i
            return L.n - 1
        })()
        let idx = cur
        const big = Math.max(1, Math.round(L.n / 10))
        switch (e.key) {
            case "ArrowLeft": idx = cur == null ? lastActive : Math.max(0, cur - 1); break
            case "ArrowRight": idx = cur == null ? lastActive : Math.min(L.n - 1, cur + 1); break
            case "PageUp": idx = Math.max(0, (cur ?? lastActive) - big); break
            case "PageDown": idx = Math.min(L.n - 1, (cur ?? lastActive) + big); break
            case "Home": idx = 0; break
            case "End": idx = L.n - 1; break
            case "Escape": setHover(null); return
            default: return
        }
        e.preventDefault()
        setHover({ idx, src: this.name })
        this.live.textContent = this.tipText(idx)
    }

    tipRows(idx) {
        const d = this.data
        const b = d.buckets[idx]
        const rows = d.keys.map((k) => ({ ...k, v: b.vals[k.key] || 0 })).filter((r) => r.v > 0).sort((a, z) => z.v - a.v)
        return { b, rows }
    }

    tipText(idx) {
        const { b, rows } = this.tipRows(idx)
        const d = this.data
        return `${bucketTitle(d.gran, b)}: ${rows.map((r) => `${r.label} ${d.fmt(r.v)}`).join(", ") || "no activity"}. Total ${d.fmt(b.total)}.`
    }

    showHover(idx, withTip) {
        const L = this.layout
        const hide = () => { this.band.hidden = this.xhair.hidden = this.tip.hidden = true }
        if (idx == null || !L || !this.data?.buckets[idx]) return hide()
        const x = L.m.l + (idx + 0.5) * L.band
        this.xhair.hidden = false
        this.xhair.style.cssText = `left:${x}px;top:${L.m.t}px;height:${L.ph}px`
        this.band.hidden = false
        const bwHl = Math.max(4, L.band)
        this.band.style.cssText = `left:${x - bwHl / 2}px;width:${bwHl}px;top:${L.m.t}px;height:${L.ph}px`
        if (!withTip) { this.tip.hidden = true; return }
        const d = this.data
        const { b, rows } = this.tipRows(idx)
        const shown = rows.slice(0, 8)
        const more = rows.length - shown.length
        this.tip.innerHTML = `<div class="tip-h">${esc(bucketTitle(d.gran, b))}${b.partial ? "<span>in progress</span>" : ""}</div>
            ${shown.map((r) => `<div class="tip-r" style="--c:${r.color}"><i></i><span>${esc(r.label)}</span><b>${esc(d.fmt(r.v))}</b></div>`).join("") || `<div class="tip-r"><i style="background:none"></i><span class="muted">No activity</span><b></b></div>`}
            ${more > 0 ? `<div class="tip-r"><i style="background:none"></i><span class="muted">+${more} more</span><b></b></div>` : ""}
            <div class="tip-r tip-t"><i style="background:none"></i><span>Total</span><b>${esc(d.fmt(b.total))}</b></div>
            ${d.metric === "cost" && b.unpriced > 0 ? `<div class="tip-n">${esc(fmtTok(b.unpriced))} unpriced tokens excluded</div>` : ""}`
        this.tip.hidden = false
        const tw = this.tip.offsetWidth
        let left = x + 14
        if (left + tw > L.W) left = x - 14 - tw
        if (left < 0) left = Math.max(0, Math.min(L.W - tw, x - tw / 2))
        this.tip.style.transform = `translate(${Math.round(left)}px, ${L.m.t + 2}px)`
    }
}

function mulberry(seed) {
    let a = seed >>> 0
    return () => {
        a = (a + 0x6d2b79f5) >>> 0
        let t = a
        t = Math.imul(t ^ (t >>> 15), t | 1)
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
}

function diurnal(h) {
    const curve = [0.25, 0.12, 0.04, 0.02, 0.01, 0.01, 0.03, 0.1, 0.35, 0.75, 0.95, 1, 0.7, 0.55, 0.85, 1, 0.95, 0.9, 0.7, 0.45, 0.5, 0.65, 0.6, 0.45]
    return curve[h % 24]
}

function demoActivity(gran, start, rnd) {
    const t = +start / MIN
    if (gran === "minute") {
        const s = Math.sin(t / 17) + Math.sin(t / 41 + 1.3) + (rnd() - 0.5) * 0.8
        return s > 0.2 ? (0.4 + rnd() * 0.9) * Math.max(0.35, diurnal(start.getHours())) : 0
    }
    if (gran === "hour") return diurnal(start.getHours()) * (0.55 + rnd() * 0.7) * 0.55
    if (gran === "day") {
        const wd = start.getDay()
        return (wd === 0 || wd === 6 ? 0.18 : 0.42) * (0.6 + rnd() * 0.8)
    }
    const age = (Date.now() - +start) / (30 * DAY)
    return 0.3 * Math.max(0.15, 1 - age * 0.07) * (0.7 + rnd() * 0.6)
}

function demoSeries(m, tokens, rnd) {
    const claude = m.provider === "claude"
    const input = Math.round(tokens * (claude ? 0.015 : 0.045) * (0.7 + rnd() * 0.6))
    const cw = claude ? Math.round(tokens * 0.05 * (0.6 + rnd() * 0.8)) : 0
    const out = Math.round(tokens * (claude ? 0.07 : 0.095) * (0.7 + rnd() * 0.6))
    const cr = Math.max(0, tokens - input - cw - out)
    const total = input + cw + out + cr
    const s = {
        provider: m.provider,
        model: m.model,
        requests: Math.max(1, Math.round(total / (claude ? 42000 : 28000))),
        input_tokens: input,
        cache_read_tokens: cr,
        cache_write_tokens: cw,
        output_tokens: out,
        reasoning_tokens: Math.round(out * (claude ? 0.3 : 0.55)),
        total_tokens: total,
        priced: !!m.p,
        cost_usd: 0,
        cost_breakdown: null,
    }
    if (m.p) {
        const b = { input: (input * m.p.in) / 1e6, cache_read: (cr * m.p.cr) / 1e6, cache_write: (cw * m.p.cw) / 1e6, output: (out * m.p.out) / 1e6 }
        s.cost_breakdown = b
        s.cost_usd = b.input + b.cache_read + b.cache_write + b.output
    }
    return s
}

const SUM_FIELDS = ["requests", "input_tokens", "cache_read_tokens", "cache_write_tokens", "output_tokens", "reasoning_tokens", "total_tokens", "cost_usd"]
function sumSeries(list, base) {
    const o = { ...base, priced: true, cost_breakdown: { input: 0, cache_read: 0, cache_write: 0, output: 0 } }
    for (const f of SUM_FIELDS) o[f] = 0
    for (const s of list) {
        for (const f of SUM_FIELDS) o[f] += s[f] || 0
        if (s.priced && s.cost_breakdown) for (const k of Object.keys(o.cost_breakdown)) o.cost_breakdown[k] += s.cost_breakdown[k]
        if (!s.priced) o.priced = false
    }
    if (!o.priced) o.cost_breakdown = null
    return o
}

function demoHistory(gran, from) {
    const now = new Date()
    let start = new Date(from)
    const buckets = []
    const salt = { minute: 11, hour: 23, day: 37, month: 53 }[gran]
    while (start < now) {
        const end = addGran(start, gran)
        const rnd = mulberry(Math.floor(+start / MIN) * 31 + salt)
        const dur = (+end - +start) / MIN
        const elapsed = Math.min(1, Math.max(0, (+now - +start) / (+end - +start)))
        const tokens = 52000 * dur * demoActivity(gran, start, rnd) * elapsed
        const series = []
        if (tokens > 0) {
            for (const m of DEMO_MODELS) {
                const present = rnd() < (gran === "minute" || gran === "hour" ? m.presence : Math.min(1, m.presence + 0.4))
                const share = m.w * (0.55 + rnd() * 0.9)
                if (present && tokens * share > 50) series.push(demoSeries(m, tokens * share, rnd))
            }
        }
        buckets.push({ start: start.toISOString(), series })
        start = end
    }
    const all = buckets.flatMap((b) => b.series)
    const byModel = new Map()
    for (const s of all) {
        const k = seriesKey(s)
        if (!byModel.has(k)) byModel.set(k, [])
        byModel.get(k).push(s)
    }
    const models = [...byModel.values()].map((list) => sumSeries(list, { provider: list[0].provider, model: list[0].model })).sort((a, b) => b.cost_usd - a.cost_usd)
    const totals = sumSeries(all.filter((s) => s.priced), {})
    const unpricedAll = all.filter((s) => !s.priced)
    for (const f of SUM_FIELDS) if (f !== "cost_usd") totals[f] += unpricedAll.reduce((a, s) => a + (s[f] || 0), 0)
    delete totals.priced
    return { granularity: gran, tz: TZ, from, to: now.toISOString(), pricing: { status: "fresh", updated_at: new Date(+now - 2 * HOUR).toISOString() }, buckets, totals, models }
}

    const now = Date.now()
    const drift = ((now - demo.t0) / MIN) * 0.2
    const iso = (t) => new Date(t).toISOString()
    const providers = demo.providers.map((p) => {
        const accounts = p.accounts.map((a) => {
            const windows = a.wins.map((w) => ({
                kind: w.kind,
                label: w.label,
                used_percent: round(a.status === "ok" ? Math.min(100, w.used + drift * (w.kind === "five_hour" ? 1 : 0.2)) : w.used, 1),
                resets_at: iso(w.resetsAt),
                window_minutes: w.minutes,
            }))
            const reached = windows.some((w) => {
                const reserve = w.kind === "five_hour" ? a.r5 : w.kind === "weekly" ? a.rw : 0
                return reserve > 0 && 100 - w.used_percent <= reserve
            })
            const status = a.status === "cooldown" && a.cooldownUntil && a.cooldownUntil < now ? "ok" : a.status
            return {
                priority: a.priority,
                quota_limit_percent: 0,
                quota_5h_remaining_percent: a.r5,
                quota_weekly_remaining_percent: a.rw,
                limit_reached: reached,
                auth_index: a.auth_index,
                label: a.label,
                plan: a.plan,
                disabled: false,
                status: reached && status === "ok" ? "quota_limit" : status,
                cooldown_until: a.cooldownUntil && a.cooldownUntil > now ? iso(a.cooldownUntil) : null,
                source: a.source,
                observed_at: iso(a.source === "probe" ? now - (a.observed % 15000) - 2000 : a.observed),
                error: a.error,
                windows,
                resets: a.resets && { available: a.resets.available, next_credit_id: a.resets.available ? a.resets.id : "", next_expires_at: a.resets.available ? iso(a.resets.expires) : null },
            }
        })
        const groups = new Map()
        for (const a of accounts) for (const w of a.windows) {
            if (w.kind === "other") continue
            const k = winKey(w)
            if (!groups.has(k)) groups.set(k, { kind: w.kind, label: w.label, used_percent: 0, capacity_percent: 0, reporting_accounts: 0, next_reset_at: null })
            const g = groups.get(k)
            g.used_percent = round(g.used_percent + w.used_percent, 1)
            g.capacity_percent += 100
            g.reporting_accounts++
            if (!g.next_reset_at || w.resets_at < g.next_reset_at) g.next_reset_at = w.resets_at
        }
        return {
            provider: p.provider,
            label: p.label,
            account_count: accounts.length,
            windows: [...groups.values()],
            resets_available: accounts.reduce((s, a) => s + (a.resets?.available || 0), 0),
            accounts,
        }
    })
    return { checked_at: iso(now), providers, routing_strategy: demo.routing }
}

async function demoApi(path, init) {
    await new Promise((r) => setTimeout(r, 220 + Math.random() * 260))
    if (path.endsWith("/limits")) return demoLimits()
    if (path.includes("/history")) {
        const q = new URL(path, location.href).searchParams
        return demoHistory(q.get("granularity") || "hour", q.get("from"))
    }
    // Edits only change this page's in-memory demo data, never the real config.
    if (path.endsWith("/config/routing/strategy") && init.method === "PUT") {
        const value = JSON.parse(init.body)
        if (!ROUTING.some((r) => r.value === value)) throw new ApiError(400, "invalid_config", "invalid strategy")
        demo.routing = value
        return { status: "ok", "config-version": 8 }
    }
    if (path.startsWith(`${MGMT}/credentials?`)) {
        const idx = new URL(path, location.href).searchParams.get("auth_index")
        const found = demo.providers.flatMap((p) => p.accounts).some((x) => x.auth_index === idx)
        return { files: found ? [{ id: `${idx}.json`, name: `${idx}.json`, auth_index: idx }] : [] }
    }
    if (path.endsWith("/credentials/fields") && init.method === "PATCH") {
        const { name, ...fields } = JSON.parse(init.body)
        const a = demo.providers.flatMap((p) => p.accounts).find((x) => `${x.auth_index}.json` === name)
        if (!a) throw new ApiError(404, "", "auth file not found")
        // The first save for this account fails, so retrying a partial save can be tried.
        if (a.auth_index === "cl-e4a9" && !a.failedOnce) {
            a.failedOnce = true
            throw new ApiError(500, "", "failed to update auth: credential file is read-only (demo)")
        }
        if ("priority" in fields) a.priority = fields.priority
        if ("quota_5h_remaining_percent" in fields) a.r5 = fields.quota_5h_remaining_percent
        if ("quota_weekly_remaining_percent" in fields) a.rw = fields.quota_weekly_remaining_percent
        return { status: "ok" }
    }
    if (path.endsWith("/limits/reset")) {
        await new Promise((r) => setTimeout(r, 1100))
        const { auth_index, credit_id } = JSON.parse(init.body)
        const a = demo.providers.flatMap((p) => p.accounts).find((x) => x.auth_index === auth_index)
        if (!a) throw new ApiError(404, "not_found", "unknown auth_index")
        if (!a.resets?.available) return { outcome: "no_credit", warning: "" }
        if (a.resets.id !== credit_id) return { outcome: "already_redeemed", warning: "" }
        if (a.auth_index === "cl-7f3a" && a.attempts++ === 0) throw new ApiError(502, "unconfirmed", "Upstream accepted the request but did not confirm the redemption.")
        const drift = ((Date.now() - demo.t0) / MIN) * 0.2
        for (const x of demo.providers.flatMap((p) => p.accounts)) {
            if (x.status === "ok") for (const w of x.wins) w.used = Math.min(100, w.used + drift * (w.kind === "five_hour" ? 1 : 0.2))
        }
        a.resets.available--
        a.resets.id = `${a.resets.id}-next`
        a.status = "ok"
        a.cooldownUntil = null
        let warning = ""
        for (const w of a.wins) {
            if (w.kind === "five_hour") { w.used = 0; w.resetsAt = Date.now() + 5 * HOUR }
            else if (a.auth_index === "cl-91c0") warning = "Weekly window was not reset by upstream."
            else { w.used = 0; w.resetsAt = Date.now() + 7 * DAY }
        }
        demo.t0 = Date.now()
        return { outcome: "reset", warning }
    }
    throw new ApiError(404, "not_found", path)
}
