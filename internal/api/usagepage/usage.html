<script type="module">
const KEY_STORAGE = "cpa-usage-management-key"
const PREFS_STORAGE = "cpa-usage-prefs"
const API = "/v8/management/observability/usage"
const DEMO = new URLSearchParams(location.search).get("demo") === "1"
const MIN = 60_000
const HOUR = 3_600_000
const DAY = 86_400_000
const GRANS = ["minute", "hour", "day", "month"]
const MODES = ["model", "category"]
const RANGE_LABEL = { minute: "Last 3 hours", hour: "Last 48 hours", day: "Last 30 days", month: "Last 12 months" }
const BUCKETS = { minute: 180, hour: 48, day: 30, month: 12 }
const LIMITS_INTERVAL = 15_000
const historyInterval = () => (state.prefs.granularity === "minute" || state.prefs.granularity === "hour" ? 30_000 : 120_000)
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)")

const $ = (sel, root = document) => root.querySelector(sel)
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])
const round = (n, d = 1) => Math.round(n * 10 ** d) / 10 ** d

// ---------- Formatting (browser locale, English copy) ----------

const LOCALE = navigator.languages?.length ? [...navigator.languages] : undefined
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone
const nf = new Intl.NumberFormat(LOCALE)
const nf1 = new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 1 })
const pctFmt = new Intl.NumberFormat(LOCALE, { style: "percent", maximumFractionDigits: 0 })
const pct1Fmt = new Intl.NumberFormat(LOCALE, { style: "percent", maximumFractionDigits: 1 })
const usd2 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", currencyDisplay: "narrowSymbol" })
const usd0 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", currencyDisplay: "narrowSymbol", maximumFractionDigits: 0 })
const usd3 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", currencyDisplay: "narrowSymbol", maximumFractionDigits: 3 })
const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: "auto" })
const rtfN = new Intl.RelativeTimeFormat(LOCALE, { numeric: "always", style: "narrow" })
const df = (opts) => new Intl.DateTimeFormat(LOCALE, opts)
const fTime = df({ hour: "2-digit", minute: "2-digit" })
const fDayMonth = df({ day: "numeric", month: "long" })
const fDayMonthYear = df({ day: "numeric", month: "long", year: "numeric" })
const fWeekDay = df({ weekday: "short", day: "numeric", month: "long" })
const fDayShort = df({ day: "numeric", month: "short" })
const fWeekDayShort = df({ weekday: "short", day: "numeric", month: "short" })
const fWeekDayLong = df({ weekday: "long", day: "numeric", month: "long" })
const fMonth = df({ month: "short" })
const fMonthYear = df({ month: "short", year: "numeric" })
const fMonthYearLong = df({ month: "long", year: "numeric" })

function fmtTok(n) {
    const a = Math.abs(n)
    if (a >= 1e9) return nf1.format(n / 1e9) + "B"
    if (a >= 1e6) return nf1.format(n / 1e6) + "M"
    if (a >= 1e3) return nf1.format(n / 1e3) + "K"
    return nf.format(Math.round(n))
}
const fmtUsd = (n) => (n > 0 && n < 0.01 ? usd3 : usd2).format(n)
const fmtUsdAxis = (n) => (n >= 10 ? usd0 : usd2).format(n)
const fmtPct = (p) => pctFmt.format(p / 100)

function pctParts(p) {
    return pctFmt.formatToParts(p / 100)
        .map((part) => (part.type === "percentSign" ? `<small>${esc(part.value)}</small>` : esc(part.value)))
        .join("")
}

function dayDiff(d, now = new Date()) {
    const a = new Date(d.getFullYear(), d.getMonth(), d.getDate())
    const b = new Date(now.getFullYear(), now.getMonth(), now.getDate())
    return Math.round((a - b) / DAY)
}

// "23:10 · 18 ottobre", with today/tomorrow/weekday for near dates.
function absTime(iso) {
    const d = new Date(iso)
    if (Number.isNaN(+d)) return ""
    const diff = dayDiff(d)
    let day
    if (diff === 0 || diff === 1 || diff === -1) day = rtf.format(diff, "day")
    else if (diff > 1 && diff < 7) day = fWeekDay.format(d)
    else if (d.getFullYear() !== new Date().getFullYear()) day = fDayMonthYear.format(d)
    else day = fDayMonth.format(d)
    return `${fTime.format(d)} · ${day}`
}

// Compact absolute time: "16:34", or "29 ott, 21:10" for other days.
function absShort(iso) {
    const d = new Date(iso)
    if (Number.isNaN(+d)) return ""
    return dayDiff(d) === 0 ? fTime.format(d) : `${fDayShort.format(d)}, ${fTime.format(d)}`
}

function swapNumber(parts, text) {
    let done = false
    return parts.map((p) => {
        if (p.type === "literal") return p.value
        if (done) return ""
        done = true
        return text
    }).join("")
}

// Relative time that stays readable: "in 34 min", "in 2:34 h", "in 4.3 days".
function relTime(iso, now = Date.now()) {
    const t = new Date(iso).getTime()
    if (Number.isNaN(t)) return ""
    const diff = t - now
    const sign = diff < 0 ? -1 : 1
    const s = Math.abs(diff) / 1000
    if (s < 45) return rtfN.format(sign * Math.max(1, Math.round(s)), "second")
    if (s < 3600) return rtfN.format(sign * Math.round(s / 60), "minute")
    if (s < 86400) {
        const h = Math.floor(s / 3600)
        const m = Math.floor((s % 3600) / 60)
        return swapNumber(rtfN.formatToParts(sign * 2, "hour"), `${h}:${String(m).padStart(2, "0")}`)
    }
    const d = s / 86400
    return rtfN.format(sign * (d < 10 ? round(d, 1) : Math.round(d)), "day")
}

function agoShort(ms) {
    const s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return `${s}s ago`
    if (s < 3600) return `${Math.floor(s / 60)}m ago`
    return `${Math.floor(s / 3600)}h ago`
}

// ---------- Colors ----------

const okl = (l, c, h) => `oklch(${round(l, 3)} ${round(c, 3)} ${round(h, 1)})`
const ld = (l, c, h, dl = 0.13) => `light-dark(${okl(l - dl, c, h)}, ${okl(l, c, h)})`

const FAMILIES = [
    { test: /opus/, l: 0.72, c: 0.17, h: 40 },
    { test: /sonnet/, l: 0.8, c: 0.14, h: 66 },
    { test: /haiku/, l: 0.87, c: 0.1, h: 92 },
    { test: /claude/, l: 0.66, c: 0.13, h: 22 },
    { test: /codex.*(mini|nano)/, l: 0.84, c: 0.11, h: 180 },
    { test: /codex/, l: 0.76, c: 0.13, h: 222 },
    { test: /^(gpt|o\d)/, l: 0.7, c: 0.15, h: 272 },
    { test: /gemini/, l: 0.78, c: 0.14, h: 150 },
]
const familyUse = new Map()
const colorCache = new Map()

function modelColor(provider, model) {
    const key = `${provider}/${model}`
    if (colorCache.has(key)) return colorCache.get(key)
    const name = String(model).toLowerCase()
    let fam = FAMILIES.findIndex((f) => f.test.test(name))
    let base = FAMILIES[fam]
    if (!base) {
        const cool = provider === "codex"
        base = provider === "claude" ? { l: 0.7, c: 0.12, h: 30 } : cool ? { l: 0.74, c: 0.1, h: 240 } : { l: 0.74, c: 0.03, h: 260 }
        fam = `x-${provider}`
    }
    const n = familyUse.get(fam) ?? 0
    familyUse.set(fam, n + 1)
    const color = ld(base.l - n * 0.08, base.c, base.h + n * 9)
    colorCache.set(key, color)
    return color
}

// Account shades inside a provider, matching the provider accent.
function acctColor(provider, i) {
    if (provider === "claude") return ld(0.76 - (i % 4) * 0.07, 0.15, 48 + (i % 4) * 16, 0.15)
    if (provider === "codex") return ld(0.8 - (i % 4) * 0.06, 0.12, 212 + (i % 4) * 24, 0.16)
    return ld(0.75 - (i % 4) * 0.06, 0.05, 260)
}

const CATS = [
    { key: "input", label: "Input", tok: "input_tokens", color: ld(0.74, 0.13, 255) },
    { key: "cache_read", label: "Cache read", tok: "cache_read_tokens", color: ld(0.8, 0.12, 165) },
    { key: "cache_write", label: "Cache write", tok: "cache_write_tokens", color: ld(0.72, 0.15, 315) },
    { key: "output", label: "Output", tok: "output_tokens", color: ld(0.82, 0.14, 78) },
]

// ---------- State ----------

function loadPrefs() {
    let raw = {}
    try { raw = JSON.parse(localStorage.getItem(PREFS_STORAGE) || "{}") || {} } catch { raw = {} }
    return {
        granularity: GRANS.includes(raw.granularity) ? raw.granularity : "hour",
        mode: MODES.includes(raw.mode) ? raw.mode : "model",
        hidden: new Set(Array.isArray(raw.hidden) ? raw.hidden.filter((k) => typeof k === "string") : []),
    }
}
function savePrefs() {
    const { granularity, mode, hidden } = state.prefs
    localStorage.setItem(PREFS_STORAGE, JSON.stringify({ granularity, mode, hidden: [...hidden] }))
}

// Claims whose outcome is unknown, keyed by auth_index. Their request ID is
// reused for any later attempt on the same credit, even after a reload, so an
// unanswered claim can never turn into a second redemption.
const PENDING_STORAGE = "cpa-usage-pending-claims"
const PENDING_TTL_MS = 24 * 3600 * 1000
function loadPending() {
    let raw
    try { raw = JSON.parse(localStorage.getItem(PENDING_STORAGE) || "{}") || {} } catch { raw = {} }
    const now = Date.now()
    return new Map(Object.entries(raw).filter(([, c]) => c && c.creditId && c.requestId && now - (c.at || 0) < PENDING_TTL_MS))
}
// Pending claims are shared by every open tab, so each change re-reads storage
// before writing instead of overwriting it with this tab's copy.
function updatePending(id, claim) {
    const fresh = loadPending()
    if (claim) fresh.set(id, claim)
    else fresh.delete(id)
    localStorage.setItem(PENDING_STORAGE, JSON.stringify(Object.fromEntries(fresh)))
    state.pending = fresh
}

function pendingUi(c) {
    return { phase: "done", code: "unconfirmed", message: "A previous reset attempt was not confirmed.", creditId: c.creditId, requestId: c.requestId }
}

// claimFor returns the claim to send for an account: an unresolved claim is
// always retried with its own credit and ID before any new claim is created.
// Web Locks (secure contexts only) serialize tabs; elsewhere the fresh
// storage read narrows the race to near-simultaneous clicks.
async function claimFor(id, credit) {
    const pick = () => {
        const existing = loadPending().get(id)
        if (existing) return existing
        const claim = { creditId: credit, requestId: newRequestId(), at: Date.now() }
        updatePending(id, claim)
        return claim
    }
    if (navigator.locks?.request) return navigator.locks.request("cpa-usage-claims", pick)
    return pick()
}

const state = {
    key: DEMO ? "demo" : localStorage.getItem(KEY_STORAGE) || "",
    prefs: loadPrefs(),
    limits: null,
    limitsAt: 0,
    limitsErr: null,
    history: null,
    historyAt: 0,
    historyErr: null,
    historyFor: null,
    resetUi: new Map(),
    pending: loadPending(),
    hover: null,
}
for (const [id, c] of state.pending) {
    if (!c.dismissed) state.resetUi.set(id, pendingUi(c))
}
window.addEventListener("storage", (e) => {
    if (e.key !== PENDING_STORAGE) return
    state.pending = loadPending()
    for (const [id, c] of state.pending) {
        if (!c.dismissed && state.resetUi.get(id)?.phase !== "busy") state.resetUi.set(id, pendingUi(c))
    }
    for (const [id, ui] of state.resetUi) {
        if (ui.code === "unconfirmed" && !state.pending.has(id)) state.resetUi.delete(id)
    }
    renderLimits()
})

// ---------- API ----------

class ApiError extends Error {
    constructor(status, code, message) {
        super(message || code || `HTTP ${status}`)
        this.status = status
        this.code = code
    }
}

async function api(path, init = {}) {
    if (DEMO) return demoApi(path, init)
    if (!state.key) throw new ApiError(401, "signed_out", "No management key")
    let res
    try {
        res = await fetch(path, {
            ...init,
            headers: { Accept: "application/json", Authorization: `Bearer ${state.key}`, ...(init.body ? { "Content-Type": "application/json" } : {}) },
        })
    } catch (err) {
        throw new ApiError(0, "network", "Network error — proxy unreachable")
    }
    let body = null
    try { body = await res.json() } catch { body = null }
    if (res.status === 401) {
        forgetKey("The key was rejected. Enter it again.")
        throw new ApiError(401, "unauthorized", "Unauthorized")
    }
    if (!res.ok) {
        const e = body?.error
        throw new ApiError(res.status, typeof e === "object" ? e?.code : undefined, typeof e === "object" ? e?.message : (e || res.statusText))
    }
    return body
}

function historyRange(gran, now = new Date()) {
    const n = BUCKETS[gran]
    let from
    if (gran === "minute") from = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes() - (n - 1))
    else if (gran === "hour") from = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() - (n - 1))
    else if (gran === "day") from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (n - 1))
    else from = new Date(now.getFullYear(), now.getMonth() - (n - 1), 1)
    return { from: from.toISOString(), to: now.toISOString() }
}

function addGran(d, gran) {
    const x = new Date(d)
    if (gran === "minute") return new Date(+x + MIN)
    if (gran === "hour") return new Date(+x + HOUR)
    if (gran === "day") return new Date(x.getFullYear(), x.getMonth(), x.getDate() + 1)
    return new Date(x.getFullYear(), x.getMonth() + 1, 1)
}

// ---------- Polling ----------

const pollers = {
    limits: { interval: () => LIMITS_INTERVAL, run: loadLimits, timer: 0, last: 0, busy: false },
    history: { interval: historyInterval, run: loadHistory, timer: 0, last: 0, busy: false },
}

function schedule(name, delay) {
    const p = pollers[name]
    clearTimeout(p.timer)
    if (document.hidden || !state.key) return
    p.timer = setTimeout(() => runPoller(name), delay ?? p.interval())
}

async function runPoller(name) {
    const p = pollers[name]
    clearTimeout(p.timer)
    if (!state.key) return
    p.last = Date.now()
    p.busy = true
    renderLive()
    try { await p.run() } finally {
        p.busy = false
        renderLive()
        schedule(name)
    }
}

function startPolling() {
    runPoller("limits")
    runPoller("history")
}

document.addEventListener("visibilitychange", () => {
    for (const name of Object.keys(pollers)) {
        const p = pollers[name]
        if (document.hidden) { clearTimeout(p.timer); continue }
        const due = p.last + p.interval() - Date.now()
        if (due <= 0) runPoller(name)
        else schedule(name, due)
    }
})

async function loadLimits() {
    try {
        state.limits = await api(`${API}/limits`)
        state.limitsAt = Date.now()
        state.limitsErr = null
    } catch (err) {
        if (err.status === 401) return
        state.limitsErr = err.message
    }
    renderLimits()
}

let historySeq = 0
async function loadHistory() {
    const gran = state.prefs.granularity
    const seq = ++historySeq
    const { from, to } = historyRange(gran)
    const qs = new URLSearchParams({ granularity: gran, from, to, tz: TZ })
    $("#activity").classList.toggle("loading", state.historyFor !== gran)
    try {
        const h = await api(`${API}/history?${qs}`)
        if (seq !== historySeq) return
        state.history = h
        state.historyFor = gran
        state.historyAt = Date.now()
        state.historyErr = null
    } catch (err) {
        if (seq !== historySeq || err.status === 401) return
        state.historyErr = err.message
    }
    $("#activity").classList.remove("loading")
    renderActivity()
}

// ---------- DOM morphing (keeps focus and lets CSS transitions run) ----------

function syncAttrs(from, to) {
    for (const a of [...from.attributes]) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name)
    for (const a of to.attributes) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value)
}

function morphChildren(parent, next) {
    const oldKids = [...parent.childNodes]
    const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute("data-key") : null)
    const keyed = new Map()
    const loose = []
    for (const c of oldKids) {
        const k = keyOf(c)
        if (k != null) keyed.set(k, c)
        else loose.push(c)
    }
    let li = 0
    let ref = parent.firstChild
    for (const n of [...next.childNodes]) {
        const k = keyOf(n)
        let match = null
        if (k != null) {
            match = keyed.get(k) ?? null
            if (match && match.nodeName !== n.nodeName) match = null
            if (match) keyed.delete(k)
        } else {
            while (li < loose.length) {
                const c = loose[li++]
                if (c.nodeType === n.nodeType && c.nodeName === n.nodeName) { match = c; break }
                if (c === ref) ref = ref.nextSibling
                c.remove()
            }
        }
        if (match) {
            if (match.nodeType === 1) { syncAttrs(match, n); morphChildren(match, n) }
            else if (match.nodeValue !== n.nodeValue) match.nodeValue = n.nodeValue
            if (match !== ref) parent.insertBefore(match, ref)
            ref = match.nextSibling
        } else {
            parent.insertBefore(n, ref)
            ref = n.nextSibling
        }
    }
    for (const c of keyed.values()) c.remove()
    while (li < loose.length) loose[li++].remove()
}

function patch(el, html) {
    const t = document.createElement("template")
    t.innerHTML = html
    morphChildren(el, t.content)
}

// ---------- Limits ----------

const winKey = (w) => (w.kind === "other" ? `other:${w.label}` : w.kind)
const acctWin = (a, w) => (a.windows || []).find((x) => winKey(x) === winKey(w))

function arcPath(cx, cy, r, a0, a1) {
    const rad = (a) => (a * Math.PI) / 180
    const p = (a) => [cx + r * Math.sin(rad(a)), cy - r * Math.cos(rad(a))]
    const [x0, y0] = p(a0)
    const [x1, y1] = p(a1)
    return `M${round(x0, 2)} ${round(y0, 2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${round(x1, 2)} ${round(y1, 2)}`
}

function gaugeHtml(p, w) {
    const used = Number(w.used_percent) || 0
    const cap = Math.max(100, Number(w.capacity_percent) || 100)
    const remaining = Math.max(0, Math.min(cap, cap - used))
    const n = Math.max(1, Math.round(cap / 100))
    const reporting = (p.accounts || []).map((a, i) => ({ a, i, w: acctWin(a, w) })).filter((x) => x.w)
    let segs
    if (reporting.length === n) {
        segs = reporting.map((x) => ({ remaining: Math.max(0, Math.min(100, 100 - (Number(x.w.used_percent) || 0))), color: acctColor(p.provider, x.i), label: x.a.label }))
    } else {
        segs = Array.from({ length: n }, (_, i) => ({ remaining: Math.min(100, Math.max(0, remaining - i * 100)), color: acctColor(p.provider, i), label: "" }))
    }
    // Pack each account's remaining capacity from the start of one continuous
    // track, leaving all depleted capacity at the end of the dial.
    const cx = 60, cy = 60, r = 47, sw = 10
    const track = arcPath(cx, cy, r, -135, 135)
    const sepUnits = 0.7
    let arcs = `<path class="seg-trk" d="${track}" stroke-width="${sw}" fill="none"/>`
    let ticks = ""
    let start = 0
    const pieces = segs.map((s) => ({ ...s, len: (s.remaining / cap) * 100 })).filter((s) => s.len > 0)
    pieces.forEach((s, i) => {
        const len = Math.max(0, s.len - (i < pieces.length - 1 ? sepUnits : 0))
        arcs += `<path class="seg-fill" d="${track}" pathLength="100" stroke-width="${sw}" fill="none" style="stroke:${s.color};stroke-dasharray:${round(len, 2)} 100;stroke-dashoffset:${round(-start, 2)}"><title>${esc(s.label ? `${s.label}: ${fmtPct(s.remaining)} left` : `${fmtPct(s.remaining)} left`)}</title></path>`
        start += s.len
    })
    for (let k = 0; k <= n * 4; k++) {
        const a = ((-135 + (270 * k) / (n * 4)) * Math.PI) / 180
        const major = k % 4 === 0
        const r0 = r + sw / 2 + 2.5, r1 = r0 + (major ? 4.5 : k % 2 ? 2 : 3)
        ticks += `<line class="g-tick${major ? " major" : ""}" x1="${round(cx + r0 * Math.sin(a), 2)}" y1="${round(cy - r0 * Math.cos(a), 2)}" x2="${round(cx + r1 * Math.sin(a), 2)}" y2="${round(cy - r1 * Math.cos(a), 2)}" stroke-width="${major ? 1.4 : 1}"/>`
    }
    const frac = used / cap
    const tone = frac >= 1 ? "full" : frac >= 0.85 ? "hot" : ""
    const reset = w.next_reset_at
    const total = p.account_count ?? (p.accounts || []).length
    const note = w.reporting_accounts != null && w.reporting_accounts < total ? `${w.reporting_accounts} of ${total} reporting` : ""
    const aria = `${p.label} ${w.label}: ${fmtPct(remaining)} left of ${fmtPct(cap)} across ${n} account${n > 1 ? "s" : ""}${reset ? `, next reset ${relTime(reset)}` : ""}`
    return `<div class="gauge" data-key="g-${esc(winKey(w))}">
        <div class="g-dial">
            <svg viewBox="0 0 120 106" role="img" aria-label="${esc(aria)}">${ticks}${arcs}</svg>
            <div class="g-center" aria-hidden="true"><div class="g-val ${tone}">${pctParts(remaining)}</div><div class="g-cap">left of ${esc(fmtPct(cap))}</div></div>
            <div class="g-label" aria-hidden="true" title="${esc(w.label)}">${esc(w.label)}</div>
        </div>
        <div class="g-reset">${reset ? `<div class="g-rel" data-rel="${esc(reset)}">${esc(relTime(reset))}</div><div class="g-abs"><span class="long">${esc(absTime(reset))}</span><span class="short">${esc(absShort(reset))}</span></div>` : `<div class="g-abs">no reset time</div>`}${note ? `<div class="g-note">${esc(note)}</div>` : ""}</div>
    </div>`
}

function paceAt(w, now = Date.now()) {
    const mins = Number(w.window_minutes)
    const t = new Date(w.resets_at).getTime()
    if (!mins || Number.isNaN(t)) return null
    const elapsed = 1 - (t - now) / (mins * MIN)
    return elapsed > 0 && elapsed < 1 ? elapsed * 100 : null
}

const SOURCE_LABEL = { probe: "live probe", headers: "from headers", none: "no data" }

function accountHtml(p, a, i) {
    const color = acctColor(p.provider, i)
    const ui = state.resetUi.get(a.auth_index)
    const chips = []
    if (a.disabled || a.status === "disabled") chips.push(`<span class="chip">Disabled</span>`)
    if (a.status === "cooldown") chips.push(`<span class="chip chip-warn">Cooldown${a.cooldown_until ? ` · <span data-rel="${esc(a.cooldown_until)}">${esc(relTime(a.cooldown_until))}</span>` : ""}</span>`)
    if (a.status === "error") chips.push(`<span class="chip chip-bad">Probe failed</span>`)
    const meta = []
    if (a.plan) meta.push(`<span>${esc(a.plan)}</span>`)
    meta.push(`<span class="${meta.length ? "dot" : ""}">${esc(SOURCE_LABEL[a.source] || a.source || "")}${a.observed_at ? ` <span data-rel="${esc(a.observed_at)}">${esc(relTime(a.observed_at))}</span>` : ""}</span>`)
    const wins = (a.windows || []).map((w) => {
        const u = Number(w.used_percent) || 0
        const remaining = Math.max(0, Math.min(100, 100 - u))
        const tone = u >= 100 ? "full" : u >= 85 ? "hot" : ""
        const elapsed = paceAt(w)
        const pace = elapsed == null ? null : 100 - elapsed
        return `<div class="win" data-key="w-${esc(winKey(w))}">
            <div class="win-top"><span>${esc(w.label)}</span><span class="v ${tone}">${esc(fmtPct(remaining))} left</span></div>
            <div class="bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${round(remaining, 1)}" aria-label="${esc(`${w.label} left`)}"><i style="width:${remaining}%"></i>${pace != null ? `<b style="left:${round(pace, 2)}%" title="Even pace"></b>` : ""}</div>
            <div class="win-reset">${w.resets_at ? `<b data-rel="${esc(w.resets_at)}">${esc(relTime(w.resets_at))}</b> · ${esc(absShort(w.resets_at))}` : "no reset time"}</div>
        </div>`
    }).join("")
    meta.push(`<span>Priority ${esc(a.priority ?? 0)}</span>`)
    meta.push(`<span>${a.quota_limit_percent > 0 ? `Stop at ${esc(a.quota_limit_percent)}% used` : "Upstream limit"}</span>`)
    if (a.limit_reached) chips.push('<span class="pill">Usage limit reached</span>')
    const r = a.resets
    let act = ""
    if (!r) act = `<span class="credit">resets unknown</span>`
    else if (!r.available) act = `<span class="credit">no resets</span>`
    else {
        act = `<span class="credit"><b>${nf.format(r.available)} reset${r.available > 1 ? "s" : ""}</b>${r.next_expires_at ? `<br>exp. ${esc(absShort(r.next_expires_at))}` : ""}</span>`
        if (ui?.phase === "busy") act += `<button class="btn btn-accent" type="button" disabled><span class="spin" aria-hidden="true"></span>Redeeming…</button>`
        else if (ui?.phase !== "confirm" && r.next_credit_id && !a.disabled) act += `<button class="btn btn-accent" type="button" data-action="reset-open" data-id="${esc(a.auth_index)}" data-focus="open-${esc(a.auth_index)}">Use reset</button>`
    }
    let msg = ""
    if (a.error) msg += `<div class="err-line">${esc(a.error)}</div>`
    if (ui?.phase === "confirm") {
        const exp = r?.next_expires_at ? ` This credit expires <b>${esc(absTime(r.next_expires_at))}</b>.` : ""
        msg += `<div class="confirm" role="group" aria-label="Confirm reset">
            <p>Redeem a ${esc(p.label)} reset on <b>${esc(a.label)}</b>? Redemption can't be undone.${exp}</p>
            <div class="confirm-actions">
                <button class="btn btn-ghost" type="button" data-action="reset-cancel" data-id="${esc(a.auth_index)}" data-focus="cancel-${esc(a.auth_index)}">Cancel</button>
                <button class="btn btn-commit" type="button" data-action="reset-confirm" data-id="${esc(a.auth_index)}">Redeem reset</button>
            </div>
        </div>`
    } else if (ui?.phase === "done") {
        const o = describeOutcome(ui)
        msg += `<div class="outcome ${o.tone}" role="status">
            <div class="outcome-body">${esc(o.text)}${o.detail ? `<small>${esc(o.detail)}</small>` : ""}</div>
            <div class="outcome-acts">${o.retry ? `<button class="btn btn-accent" type="button" data-action="reset-retry" data-id="${esc(a.auth_index)}" data-focus="retry-${esc(a.auth_index)}">Retry same credit</button>` : ""}<button class="btn btn-ghost" type="button" data-action="reset-dismiss" data-id="${esc(a.auth_index)}" data-focus="dismiss-${esc(a.auth_index)}">Dismiss</button></div>
        </div>`
    }
    const cls = ["acct", a.disabled || a.status === "disabled" ? "is-disabled" : "", a.source === "headers" || a.status === "error" ? "is-stale" : ""].join(" ")
    return `<li class="${cls}" data-key="a-${esc(a.auth_index)}" style="--c:${color}">
        <div class="acct-id"><span class="sw" aria-hidden="true"></span><div class="acct-txt">
            <div class="acct-label" title="${esc(a.label)}">${esc(a.label)}</div>
            <div class="acct-meta">${meta.join("")}${chips.join("")}</div>
        </div></div>
        <div class="acct-act">${act}</div>
        <div class="wins">${wins || `<span class="win-reset">No windows reported</span>`}</div>
        <div class="acct-msg">${msg}</div>
    </li>`
}

const OUTCOMES = {
    reset: { tone: "ok", text: "Reset redeemed. Windows refreshed." },
    nothing_to_reset: { tone: "", text: "Upstream reported nothing to reset." },
    already_redeemed: { tone: "warn", text: "This credit was already redeemed." },
    no_credit: { tone: "warn", text: "No reset credit is available for this account." },
}
// Errors that prove the claim was not applied. Anything else, including
// network failures and unknown codes, may have landed and keeps its request ID.
const DEFINITIVE_ERRORS = new Set(["rate_limited", "cooling_down", "signed_out", "not_found", "invalid_request", "upstream_failed"])
const ERRORS = {
    rate_limited: "Rate limited by upstream. Try again shortly.",
    cooling_down: "The account is cooling down. Try again later.",
    unconfirmed: "Upstream didn't confirm the redemption. Retrying uses the same credit.",
    signed_out: "The account is signed out. Re-authenticate it in the proxy.",
    not_found: "Account or credit not found.",
    invalid_request: "The proxy rejected the request.",
    upstream_failed: "The upstream request failed.",
}

function describeOutcome(ui) {
    if (ui.outcome) {
        const o = OUTCOMES[ui.outcome] || { tone: "", text: `Outcome: ${ui.outcome}` }
        return { ...o, detail: ui.warning || "" }
    }
    const text = ERRORS[ui.code] || "The reset failed."
    const detail = ui.message && ui.message !== text ? ui.message : ""
    return { tone: "bad", text, detail, retry: !DEFINITIVE_ERRORS.has(ui.code) }
}

function providerHtml(p) {
    const kind = p.provider === "claude" || p.provider === "codex" ? p.provider : "other"
    const n = p.account_count ?? (p.accounts || []).length
    const resets = Number(p.resets_available) || 0
    return `<article class="prov prov-${kind}" data-key="p-${esc(p.provider)}" aria-labelledby="pn-${esc(p.provider)}">
        <header class="prov-head">
            <h3 class="prov-name" id="pn-${esc(p.provider)}"><span class="prov-glyph" aria-hidden="true"></span>${esc(p.label || p.provider)}</h3>
            <span class="prov-count">${nf.format(n)} account${n === 1 ? "" : "s"}</span>
            ${resets > 0 ? `<span class="pill pill-reset">${nf.format(resets)} reset${resets > 1 ? "s" : ""} available</span>` : `<span class="pill pill-none">no resets</span>`}
        </header>
        <div class="gauges">${(p.windows || []).map((w) => gaugeHtml(p, w)).join("") || `<p class="muted">No windows reported yet.</p>`}</div>
        <ul class="accts">${(p.accounts || []).map((a, i) => accountHtml(p, a, i)).join("")}</ul>
    </article>`
}

function renderLimits() {
    const body = $("#limits-body")
    const notice = $("#limits-notice")
    if (!state.key) {
        patch(notice, "")
        patch(body, `<div class="locked" data-key="locked"><h3>Locked</h3><p>Enter the management key to load usage.</p><button class="btn btn-primary" type="button" data-action="unlock">Enter key</button></div>`)
        return
    }
    if (!state.limits) {
        patch(notice, state.limitsErr ? `<div class="notice bad">Couldn't load limits: ${esc(state.limitsErr)}</div>` : "")
        if (!state.limitsErr) patch(body, [0, 1].map((i) => `<div class="prov" data-key="sk${i}"><div class="sk" style="height:22px;width:40%"></div><div class="sk" style="height:150px;margin:18px 0"></div><div class="sk" style="height:60px;margin-bottom:14px"></div></div>`).join(""))
        else patch(body, "")
        return
    }
    patch(notice, state.limitsErr ? `<div class="notice">Couldn't refresh limits: ${esc(state.limitsErr)}. Showing the last data.</div>` : "")
    const providers = state.limits.providers || []
    patch(body, providers.length ? providers.map(providerHtml).join("") : `<div class="locked" data-key="empty"><h3>No accounts</h3><p>No Claude or Codex OAuth accounts are configured.</p></div>`)
    const checked = state.limits.checked_at ? `checked ${absShort(state.limits.checked_at)}` : ""
    $("#limits-meta").textContent = `${checked} · ${state.limits.routing_strategy === "fill-first" ? "One account at a time (priority)" : state.limits.routing_strategy === "weighted-round-robin" ? "Weighted distribution" : "Distributed (round-robin)"}`
}

// ---------- Reset flow ----------

function setResetUi(id, ui, focus) {
    if (ui) state.resetUi.set(id, ui)
    else state.resetUi.delete(id)
    renderLimits()
    if (focus) document.querySelector(`[data-focus="${CSS.escape(focus)}"]`)?.focus()
}

function findAccount(id) {
    for (const p of state.limits?.providers || []) for (const a of p.accounts || []) if (a.auth_index === id) return a
    return null
}

// randomUUID needs a secure context; plain-HTTP LAN access only has getRandomValues.
function newRequestId() {
    if (crypto.randomUUID) return crypto.randomUUID()
    return Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("")
}

// requestId is the claim's idempotency key: a retry of the same claim reuses it.
async function redeem(id, creditId, requestId) {
    setResetUi(id, { phase: "busy", creditId, requestId })
    updatePending(id, { creditId, requestId, at: Date.now() })
    let ui
    try {
        const res = await api(`${API}/limits/reset`, { method: "POST", body: JSON.stringify({ auth_index: id, credit_id: creditId, request_id: requestId }) })
        ui = Object.hasOwn(OUTCOMES, res?.outcome)
            ? { phase: "done", outcome: res.outcome, warning: res.warning || "", creditId, requestId }
            : { phase: "done", code: "unconfirmed", message: "The proxy returned an unrecognized reset result.", creditId, requestId }
    } catch (err) {
        if (err.status === 401) {
            state.resetUi.set(id, { phase: "done", code: "unconfirmed", message: "Sign in again, then retry the same credit.", creditId, requestId })
            return
        }
        ui = { phase: "done", code: err.code || "unconfirmed", message: err.message, creditId, requestId }
    }
    if (ui.outcome || DEFINITIVE_ERRORS.has(ui.code)) updatePending(id, null)
    state.resetUi.set(id, ui)
    await loadLimits()
    pollers.limits.last = Date.now()
    schedule("limits")
    const next = document.querySelector(`[data-focus="retry-${CSS.escape(id)}"]`) || document.querySelector(`[data-focus="dismiss-${CSS.escape(id)}"]`)
    next?.focus()
}

$("#limits-body").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]")
    if (!btn) return
    const id = btn.dataset.id
    switch (btn.dataset.action) {
        case "unlock": openAuth(); break
        case "reset-open": setResetUi(id, { phase: "confirm" }, `cancel-${id}`); break
        case "reset-cancel": setResetUi(id, null, `open-${id}`); break
        case "reset-dismiss": {
            // Keep an unresolved claim's request ID for reuse; just stop showing it.
            const pending = loadPending().get(id)
            if (pending) updatePending(id, { ...pending, dismissed: true })
            setResetUi(id, null, `open-${id}`)
            break
        }
        case "reset-confirm": {
            const credit = findAccount(id)?.resets?.next_credit_id
            const pending = loadPending().get(id)
            if (!credit && !pending) {
                setResetUi(id, { phase: "done", code: "not_found", message: "No credit id is known for this account." })
                break
            }
            claimFor(id, credit).then((claim) => redeem(id, claim.creditId, claim.requestId))
            break
        }
        case "reset-retry": {
            const ui = state.resetUi.get(id)
            if (ui?.creditId) redeem(id, ui.creditId, ui.requestId || newRequestId())
            break
        }
    }
})
$("#limits-body").addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return
    const box = e.target.closest(".confirm")
    const id = box?.querySelector("[data-id]")?.dataset.id
    if (id) setResetUi(id, null, `open-${id}`)
})

// ---------- Activity ----------

const seriesKey = (s) => `${s.provider}/${s.model}`

function modelList(h) {
    const list = (h?.models || []).map((m) => ({ ...m, key: seriesKey(m), color: modelColor(m.provider, m.model) }))
    const known = new Set(list.map((m) => m.key))
    for (const b of h?.buckets || []) for (const s of b.series || []) {
        const k = seriesKey(s)
        if (!known.has(k)) { known.add(k); list.push({ ...s, key: k, color: modelColor(s.provider, s.model) }) }
    }
    return list
}

function deriveChart(h, metric) {
    const mode = state.prefs.mode
    const hidden = state.prefs.hidden
    const models = modelList(h)
    let keys
    if (mode === "category") keys = CATS.map((c) => ({ key: c.key, label: c.label, color: c.color }))
    else keys = models
        .filter((m) => !hidden.has(m.key) && (metric === "tokens" || m.priced !== false))
        .sort((a, b) => (metric === "tokens" ? b.total_tokens - a.total_tokens : b.cost_usd - a.cost_usd))
        .map((m) => ({ key: m.key, label: m.model, color: m.color }))
    const gran = h.granularity || state.prefs.granularity
    const now = Date.now()
    const raw = h.buckets || []
    const buckets = raw.map((b, i) => {
        const start = new Date(b.start)
        const end = raw[i + 1] ? new Date(raw[i + 1].start) : addGran(start, gran)
        const vals = {}
        let unpriced = 0
        for (const s of b.series || []) {
            const k = seriesKey(s)
            if (hidden.has(k)) continue
            if (metric === "cost" && (s.priced === false || (mode === "category" && !s.cost_breakdown))) {
                unpriced += s.total_tokens || 0
                continue
            }
            if (mode === "category") {
                for (const c of CATS) {
                    const v = metric === "tokens" ? s[c.tok] : s.cost_breakdown[c.key]
                    vals[c.key] = (vals[c.key] || 0) + (Number(v) || 0)
                }
            } else {
                vals[k] = (vals[k] || 0) + (Number(metric === "tokens" ? s.total_tokens : s.cost_usd) || 0)
            }
        }
        const total = Object.values(vals).reduce((a, v) => a + v, 0)
        return { t: +start, start, end, vals, total, unpriced, partial: +end > now }
    })
    return { gran, keys, buckets, metric, fmt: metric === "tokens" ? fmtTok : fmtUsd, axis: metric === "tokens" ? fmtTok : fmtUsdAxis }
}

function niceScale(max) {
    if (!(max > 0)) return { top: 1, step: 1, empty: true }
    const raw = max / 4
    const mag = 10 ** Math.floor(Math.log10(raw))
    const norm = raw / mag
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag
    return { top: Math.ceil(max / step) * step, step }
}

function xTicks(gran, buckets, width) {
    const target = Math.max(2, Math.floor(width / 78))
    const n = buckets.length
    const steps = { minute: [5, 10, 15, 30, 60, 120], hour: [1, 2, 3, 6, 12, 24], day: [1, 2, 3, 5, 7, 10, 15], month: [1, 2, 3, 4, 6] }[gran]
    let step = steps[steps.length - 1]
    for (const s of steps) {
        if (n / s <= target) { step = s; break }
    }
    const out = []
    buckets.forEach((b, i) => {
        const d = b.start
        let on
        if (gran === "minute") on = (d.getHours() * 60 + d.getMinutes()) % step === 0
        else if (gran === "hour") on = d.getHours() % step === 0
        else if (gran === "day") on = (n - 1 - i) % step === 0
        else on = d.getMonth() % step === 0 || step === 1
        if (on) out.push(i)
    })
    return out
}

function xLabel(gran, d) {
    if (gran === "minute") return d.getHours() === 0 && d.getMinutes() === 0 ? fDayShort.format(d) : fTime.format(d)
    if (gran === "hour") return d.getHours() === 0 ? fDayShort.format(d) : fTime.format(d)
    if (gran === "day") return fDayShort.format(d)
    return d.getMonth() === 0 ? fMonthYear.format(d) : fMonth.format(d)
}

function bucketTitle(gran, b) {
    if (gran === "minute") return `${fWeekDayShort.format(b.start)} · ${fTime.format(b.start)}`
    if (gran === "hour") return `${fWeekDayShort.format(b.start)} · ${fTime.format(b.start)}–${fTime.format(b.end)}`
    if (gran === "day") return fWeekDayLong.format(b.start)
    return fMonthYearLong.format(b.start)
}

class Chart {
    constructor(el, name, label) {
        this.el = el
        this.name = name
        this.label = label
        this.data = null
        this.layout = null
        el.tabIndex = 0
        el.setAttribute("role", "group")
        el.setAttribute("aria-roledescription", "chart")
        el.innerHTML = `<div class="chart-svg"></div><div class="band-hl" hidden></div><div class="xhair" hidden></div><div class="tip" hidden aria-hidden="true"></div><span class="sr" aria-live="polite"></span>`
        this.svgEl = $(".chart-svg", el)
        this.band = $(".band-hl", el)
        this.xhair = $(".xhair", el)
        this.tip = $(".tip", el)
        this.live = $(".sr", el)
        el.addEventListener("pointermove", (e) => this.onPointer(e))
        el.addEventListener("pointerdown", (e) => this.onPointer(e))
        el.addEventListener("pointerleave", (e) => { if (e.pointerType !== "touch") setHover(null) })
        el.addEventListener("keydown", (e) => this.onKey(e))
        el.addEventListener("blur", () => { if (state.hover?.src === this.name) setHover(null) })
    }

    setData(d) {
        this.data = d
        this.render()
    }

    render() {
        const d = this.data
        const W = Math.max(260, Math.floor(this.el.clientWidth))
        const narrow = W < 560
        const H = narrow ? 210 : 264
        if (!d) {
            patch(this.svgEl, `<div class="sk" data-key="sk" style="height:${H}px"></div>`)
            this.layout = null
            return
        }
        const m = { l: narrow ? 40 : 52, r: 4, t: 12, b: 26 }
        const pw = W - m.l - m.r
        const ph = H - m.t - m.b
        const n = d.buckets.length || 1
        const max = d.buckets.reduce((a, b) => Math.max(a, b.total), 0)
        const sc = niceScale(max)
        const yv = (v) => m.t + ph - (v / sc.top) * ph
        const band = pw / n
        const gap = band > 8 ? band * 0.26 : band > 3.2 ? 1 : band > 1.6 ? 0.4 : 0
        const bw = Math.max(0.6, band - gap)
        let grid = ""
        if (!sc.empty) {
            for (let v = 0; v <= sc.top + sc.step / 2; v += sc.step) {
                const vv = round(v, 6)
                grid += `<g class="tick${vv === 0 ? " zero" : ""}" data-key="y${vv}" style="transform:translateY(${round(yv(vv), 2)}px)"><line x1="${m.l}" x2="${W - m.r}" y1="0" y2="0"/><text x="${m.l - 8}" y="0" dy="0.32em" text-anchor="end">${esc(vv === 0 ? "0" : d.axis(vv))}</text></g>`
            }
        } else {
            grid = `<g class="tick zero" data-key="y0" style="transform:translateY(${m.t + ph}px)"><line x1="${m.l}" x2="${W - m.r}" y1="0" y2="0"/></g>`
        }
        let xl = ""
        for (const i of xTicks(d.gran, d.buckets, pw)) {
            const b = d.buckets[i]
            const x = m.l + (i + 0.5) * band
            const anchor = i === 0 && x - m.l < 24 ? "start" : "middle"
            xl += `<text class="xl" data-key="x${b.t}" x="${round(x, 2)}" y="${H - 8}" text-anchor="${anchor}">${esc(xLabel(d.gran, b.start))}</text>`
        }
        const delayStep = reducedMotion.matches ? 0 : Math.min(8, 420 / n)
        let bars = ""
        d.buckets.forEach((b, i) => {
            let cum = 0
            const x = round(m.l + i * band + (band - bw) / 2, 2)
            for (const k of d.keys) {
                const v = b.vals[k.key] || 0
                if (v <= 0) continue
                const y0 = yv(cum)
                const y1 = yv(cum + v)
                cum += v
                let h = y0 - y1
                const shave = h > 3 && bw > 3 ? 1 : 0
                h = round(Math.max(0.5, h - shave), 2)
                const y = round(y1 + shave, 2)
                bars += `<rect class="bar-r${b.partial ? " partial" : ""}" data-key="${b.t}|${esc(k.key)}" x="${x}" y="${y}" width="${round(bw, 2)}" height="${h}" style="x:${x}px;y:${y}px;width:${round(bw, 2)}px;height:${h}px;fill:${k.color};--d:${round(i * delayStep)}ms"/>`
            }
        })
        const total = d.buckets.reduce((a, b) => a + b.total, 0)
        const peak = d.buckets.reduce((a, b) => (b.total > a.total ? b : a), d.buckets[0] || { total: 0 })
        const aria = `${this.label}, ${RANGE_LABEL[d.gran].toLowerCase()} by ${d.gran}. Total ${d.fmt(total)}${peak?.total ? `, peak ${d.fmt(peak.total)} at ${bucketTitle(d.gran, peak)}` : ""}.`
        patch(this.svgEl, `<svg data-key="svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><g>${grid}</g><g>${bars}</g><g>${xl}</g></svg>${total ? "" : `<div class="chart-empty" data-key="empty">No activity in this range</div>`}`)
        this.el.setAttribute("aria-label", `${this.label} chart. Use left and right arrow keys to inspect buckets.`)
        this.layout = { m, W, H, pw, ph, band, n }
        if (state.hover) this.showHover(state.hover.idx, state.hover.src === this.name)
    }

    idxFromEvent(e) {
        const L = this.layout
        if (!L) return null
        const x = e.clientX - this.el.getBoundingClientRect().left
        if (x < L.m.l - 4 || x > L.W) return null
        return Math.max(0, Math.min(L.n - 1, Math.floor((x - L.m.l) / L.band)))
    }

    onPointer(e) {
        const idx = this.idxFromEvent(e)
        setHover(idx == null ? null : { idx, src: this.name })
    }

    onKey(e) {
        const L = this.layout
        if (!L || !this.data) return
        const cur = state.hover?.src === this.name ? state.hover.idx : null
        const lastActive = (() => {
            for (let i = L.n - 1; i >= 0; i--) if (this.data.buckets[i]?.total > 0) return i
            return L.n - 1
        })()
        let idx = cur
        const big = Math.max(1, Math.round(L.n / 10))
        switch (e.key) {
            case "ArrowLeft": idx = cur == null ? lastActive : Math.max(0, cur - 1); break
            case "ArrowRight": idx = cur == null ? lastActive : Math.min(L.n - 1, cur + 1); break
            case "PageUp": idx = Math.max(0, (cur ?? lastActive) - big); break
            case "PageDown": idx = Math.min(L.n - 1, (cur ?? lastActive) + big); break
            case "Home": idx = 0; break
            case "End": idx = L.n - 1; break
            case "Escape": setHover(null); return
            default: return
        }
        e.preventDefault()
        setHover({ idx, src: this.name })
        this.live.textContent = this.tipText(idx)
    }

    tipRows(idx) {
        const d = this.data
        const b = d.buckets[idx]
        const rows = d.keys.map((k) => ({ ...k, v: b.vals[k.key] || 0 })).filter((r) => r.v > 0).sort((a, z) => z.v - a.v)
        return { b, rows }
    }

    tipText(idx) {
        const { b, rows } = this.tipRows(idx)
        const d = this.data
        return `${bucketTitle(d.gran, b)}: ${rows.map((r) => `${r.label} ${d.fmt(r.v)}`).join(", ") || "no activity"}. Total ${d.fmt(b.total)}.`
    }

    showHover(idx, withTip) {
        const L = this.layout
        const hide = () => { this.band.hidden = this.xhair.hidden = this.tip.hidden = true }
        if (idx == null || !L || !this.data?.buckets[idx]) return hide()
        const x = L.m.l + (idx + 0.5) * L.band
        this.xhair.hidden = false
        this.xhair.style.cssText = `left:${x}px;top:${L.m.t}px;height:${L.ph}px`
        this.band.hidden = false
        const bwHl = Math.max(4, L.band)
        this.band.style.cssText = `left:${x - bwHl / 2}px;width:${bwHl}px;top:${L.m.t}px;height:${L.ph}px`
        if (!withTip) { this.tip.hidden = true; return }
        const d = this.data
        const { b, rows } = this.tipRows(idx)
        const shown = rows.slice(0, 8)
        const more = rows.length - shown.length
        this.tip.innerHTML = `<div class="tip-h">${esc(bucketTitle(d.gran, b))}${b.partial ? "<span>in progress</span>" : ""}</div>
            ${shown.map((r) => `<div class="tip-r" style="--c:${r.color}"><i></i><span>${esc(r.label)}</span><b>${esc(d.fmt(r.v))}</b></div>`).join("") || `<div class="tip-r"><i style="background:none"></i><span class="muted">No activity</span><b></b></div>`}
            ${more > 0 ? `<div class="tip-r"><i style="background:none"></i><span class="muted">+${more} more</span><b></b></div>` : ""}
            <div class="tip-r tip-t"><i style="background:none"></i><span>Total</span><b>${esc(d.fmt(b.total))}</b></div>
            ${d.metric === "cost" && b.unpriced > 0 ? `<div class="tip-n">${esc(fmtTok(b.unpriced))} unpriced tokens excluded</div>` : ""}`
        this.tip.hidden = false
        const tw = this.tip.offsetWidth
        let left = x + 14
        if (left + tw > L.W) left = x - 14 - tw
        if (left < 0) left = Math.max(0, Math.min(L.W - tw, x - tw / 2))
        this.tip.style.transform = `translate(${Math.round(left)}px, ${L.m.t + 2}px)`
    }
}

const charts = {
    tokens: new Chart($("#chart-tokens"), "tokens", "Token usage"),
    cost: new Chart($("#chart-cost"), "cost", "Estimated API cost"),
}

function setHover(h) {
    state.hover = h
    for (const c of Object.values(charts)) c.showHover(h?.idx ?? null, h?.src === c.name)
}

document.addEventListener("pointerdown", (e) => {
    if (state.hover && !e.target.closest(".chart")) setHover(null)
})

function tile(key, label, value, sub, extra = "") {
    return `<div class="tile" data-key="${key}"><div class="tile-k">${esc(label)}</div><div class="tile-v">${value}</div>${extra}<div class="tile-s">${sub}</div></div>`
}

function renderActivity() {
    const h = state.history
    const gran = state.prefs.granularity
    patch($("#history-notice"), state.historyErr ? `<div class="notice${h ? "" : " bad"}">${h ? `Couldn't refresh activity: ${esc(state.historyErr)}. Showing the last data.` : `Couldn't load activity: ${esc(state.historyErr)}`}</div>` : "")
    if (!h) {
        patch($("#tiles"), [0, 1, 2, 3].map((i) => `<div class="tile" data-key="sk${i}"><div class="sk" style="height:11px;width:50%"></div><div class="sk" style="height:30px;margin:10px 0 8px;width:70%"></div><div class="sk" style="height:11px;width:60%"></div></div>`).join(""))
        patch($("#legend"), "")
        charts.tokens.setData(null)
        charts.cost.setData(null)
        patch($("#models"), `<div class="sk" style="height:160px"></div>`)
        return
    }
    const tot = h.totals || {}
    const models = modelList(h)
    const unpriced = models.filter((m) => m.priced === false)
    const prompt = (tot.input_tokens || 0) + (tot.cache_read_tokens || 0) + (tot.cache_write_tokens || 0)
    const hit = prompt ? (tot.cache_read_tokens || 0) / prompt : 0
    const req = tot.requests || 0
    const catMeter = CATS.map((c) => `<i style="width:${tot.total_tokens ? round(((tot[c.tok] || 0) / tot.total_tokens) * 100, 2) : 0}%;background:${c.color}" title="${esc(c.label)}"></i>`).join("")
    patch($("#tiles"), [
        tile("cost", "Est. API cost", esc(fmtUsd(tot.cost_usd || 0)), unpriced.length ? `<span class="pill pill-unpriced">${unpriced.length} unpriced</span><span>excluded from cost</span>` : `<span>at API list prices</span>`),
        tile("tokens", "Tokens", esc(fmtTok(tot.total_tokens || 0)), `<span>in ${esc(fmtTok(tot.input_tokens || 0))}</span><span>out ${esc(fmtTok(tot.output_tokens || 0))}</span>`, `<div class="tile-meter" aria-hidden="true">${catMeter}</div>`),
        tile("cache", "Cache hit share", esc(pct1Fmt.format(hit)), `<span>of prompt tokens read from cache</span>`, `<div class="tile-meter" aria-hidden="true"><i style="width:${round(hit * 100, 2)}%;background:${CATS[1].color}"></i></div>`),
        tile("req", "Requests", esc(nf.format(req)), `<span>${req ? `${esc(fmtTok((tot.total_tokens || 0) / req))} tokens / request` : "no requests"}</span>`),
    ].join(""))

    const hidden = state.prefs.hidden
    const sorted = [...models].sort((a, b) => b.total_tokens - a.total_tokens)
    patch($("#legend"), `<span class="legend-k" data-key="k">Models</span>${sorted.map((m) => `<button class="lg" type="button" data-key="lg-${esc(m.key)}" data-model="${esc(m.key)}" aria-pressed="${!hidden.has(m.key)}" style="--c:${m.color}" title="${esc(m.provider)}"><i aria-hidden="true"></i>${esc(m.model)}${m.priced === false ? " <em>unpriced</em>" : ""}</button>`).join("")}${[...hidden].some((k) => models.some((m) => m.key === k)) ? `<button class="btn btn-ghost lg-reset" type="button" data-key="showall" data-action="show-all">Show all</button>` : ""}`)

    const tok = deriveChart(h, "tokens")
    const cost = deriveChart(h, "cost")
    charts.tokens.setData(tok)
    charts.cost.setData(cost)
    const visTok = tok.buckets.reduce((a, b) => a + b.total, 0)
    const visCost = cost.buckets.reduce((a, b) => a + b.total, 0)
    const by = state.prefs.mode === "category" ? "by category" : "by model"
    $("#tok-sub").textContent = `${fmtTok(visTok)} · ${by}`
    $("#cost-sub").textContent = `${fmtUsd(visCost)} · ${by}`
    patch($("#tok-keys"), state.prefs.mode === "category" ? `<div class="keys" aria-label="Categories">${CATS.map((c) => `<span style="--c:${c.color}"><i></i>${esc(c.label)}</span>`).join("")}</div>` : "")

    const pr = h.pricing || {}
    const pn = $("#pricing-note")
    pn.className = "panel-note" + (pr.status === "unavailable" || pr.status === "cached" ? " warn" : "")
    pn.textContent = pr.status === "unavailable" ? "Pricing unavailable — costs may be missing"
        : pr.status === "cached" ? `Cached prices${pr.updated_at ? ` from ${absShort(pr.updated_at)}` : ""}`
        : pr.updated_at ? `Prices updated ${relTime(pr.updated_at)}` : ""

    const totCost = tot.cost_usd || 0
    const rows = models.map((m, i) => {
        const share = totCost && m.priced !== false ? (m.cost_usd || 0) / totCost : 0
        return `<tr data-key="r-${esc(m.key)}" class="${hidden.has(m.key) ? "is-hidden" : ""}" style="--c:${m.color}">
            <td class="rank">${i + 1}</td>
            <td><span class="m-name"><i aria-hidden="true"></i>${esc(m.model)}</span></td>
            <td class="col-prov"><span class="prov-tag">${esc(m.provider)}</span></td>
            <td class="num col-req">${esc(nf.format(m.requests || 0))}</td>
            <td class="num">${esc(fmtTok(m.total_tokens || 0))}</td>
            <td class="num">${m.priced === false ? `<span class="unpriced" title="No price known; excluded from cost">Unpriced</span>` : esc(fmtUsd(m.cost_usd || 0))}</td>
            <td><div class="share"><div class="share-bar" aria-hidden="true"><i style="width:${round(share * 100, 2)}%"></i></div><span>${m.priced === false ? "—" : esc(pctFmt.format(share))}</span></div></td>
        </tr>`
    }).join("")
    $("#models-sub").textContent = `${models.length} · ${RANGE_LABEL[gran].toLowerCase()}`
    patch($("#models"), models.length ? `<table class="tbl" data-key="tbl">
        <thead><tr><th class="rank" scope="col">#</th><th scope="col">Model</th><th class="col-prov" scope="col">Provider</th><th class="num col-req" scope="col">Requests</th><th class="num" scope="col">Tokens</th><th class="num" scope="col">Cost</th><th scope="col">Share of cost</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td></td><td>Total</td><td class="col-prov"></td><td class="num col-req">${esc(nf.format(req))}</td><td class="num">${esc(fmtTok(tot.total_tokens || 0))}</td><td class="num">${esc(fmtUsd(totCost))}</td><td></td></tr></tfoot>
    </table>` : `<p class="muted" data-key="none">No models used in this range.</p>`)
}

$("#legend").addEventListener("click", (e) => {
    const btn = e.target.closest("button")
    if (!btn) return
    const hidden = state.prefs.hidden
    if (btn.dataset.action === "show-all") hidden.clear()
    else if (btn.dataset.model) {
        const k = btn.dataset.model
        if (hidden.has(k)) hidden.delete(k)
        else hidden.add(k)
    }
    savePrefs()
    renderActivity()
    if (btn.dataset.action === "show-all") $("#legend .lg")?.focus()
})

for (const input of document.querySelectorAll('input[name="gran"]')) input.checked = input.value === state.prefs.granularity
for (const input of document.querySelectorAll('input[name="mode"]')) input.checked = input.value === state.prefs.mode
$("#gran-ctl").addEventListener("change", (e) => {
    state.prefs.granularity = e.target.value
    savePrefs()
    setHover(null)
    runPoller("history")
})
$("#mode-ctl").addEventListener("change", (e) => {
    state.prefs.mode = e.target.value
    savePrefs()
    renderActivity()
})

let resizeFrame = 0
new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame)
    resizeFrame = requestAnimationFrame(() => { for (const c of Object.values(charts)) c.render() })
}).observe($("#chart-tokens"))

// ---------- Live status and ticking ----------

function renderLive() {
    const live = $("#live")
    const lbl = $("#live-lbl")
    const ago = $("#live-ago")
    const busy = pollers.limits.busy || pollers.history.busy
    $("#refresh").classList.toggle("is-busy", busy)
    if (!state.key) { live.dataset.state = "idle"; lbl.textContent = "Locked"; ago.textContent = ""; return }
    const at = state.limitsAt
    if (!at) {
        live.dataset.state = state.limitsErr ? "error" : "idle"
        lbl.textContent = state.limitsErr ? "Offline" : "Connecting"
        ago.textContent = ""
        live.title = state.limitsErr || ""
        return
    }
    const age = Date.now() - at
    const stale = state.limitsErr || age > LIMITS_INTERVAL * 3
    live.dataset.state = stale ? "stale" : "live"
    lbl.textContent = stale ? "Stale ·" : "Live ·"
    ago.textContent = `updated ${agoShort(age)}`
    live.title = state.limitsErr ? `Last refresh failed: ${state.limitsErr}` : ""
}

function tick() {
    const now = Date.now()
    for (const el of document.querySelectorAll("[data-rel]")) {
        const text = relTime(el.dataset.rel, now)
        if (el.textContent !== text) el.textContent = text
    }
    renderLive()
}
setInterval(tick, 1000)

$("#refresh").addEventListener("click", () => { if (state.key) startPolling(); else openAuth() })

// ---------- Auth ----------

const authDialog = $("#auth")

function openAuth(message) {
    const err = $("#auth-err")
    err.hidden = !message
    err.textContent = message || ""
    $("#auth-key").value = ""
    if (!authDialog.open) authDialog.showModal()
    $("#auth-key").focus()
}

function forgetKey(message) {
    localStorage.removeItem(KEY_STORAGE)
    state.key = ""
    state.limits = null
    state.history = null
    state.historyFor = null
    state.limitsAt = state.historyAt = 0
    state.limitsErr = state.historyErr = null
    state.resetUi.clear()
    for (const p of Object.values(pollers)) clearTimeout(p.timer)
    renderAll()
    openAuth(message)
}

$("#auth-form").addEventListener("submit", (e) => {
    e.preventDefault()
    const key = $("#auth-key").value.trim()
    if (!key) return
    localStorage.setItem(KEY_STORAGE, key)
    state.key = key
    authDialog.close()
    renderAll()
    startPolling()
})
$("#auth-cancel").addEventListener("click", () => authDialog.close())
$("#signout").addEventListener("click", () => forgetKey())

// ---------- Boot ----------

function renderAll() {
    renderLimits()
    renderActivity()
    renderLive()
}

$("#footer").textContent = `Times in ${TZ}. Costs are estimates at API list prices and exclude unpriced models; subscriptions are billed separately. The tick on each account bar marks even pace through the window.`

if (DEMO) {

}
renderAll()
if (state.key) startPolling()

function mulberry(seed) {
    let a = seed >>> 0
    return () => {
        a = (a + 0x6d2b79f5) >>> 0
        let t = a
        t = Math.imul(t ^ (t >>> 15), t | 1)
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
}

function diurnal(h) {
    const curve = [0.25, 0.12, 0.04, 0.02, 0.01, 0.01, 0.03, 0.1, 0.35, 0.75, 0.95, 1, 0.7, 0.55, 0.85, 1, 0.95, 0.9, 0.7, 0.45, 0.5, 0.65, 0.6, 0.45]
    return curve[h % 24]
}

function demoActivity(gran, start, rnd) {
    const t = +start / MIN
    if (gran === "minute") {
        const s = Math.sin(t / 17) + Math.sin(t / 41 + 1.3) + (rnd() - 0.5) * 0.8
        return s > 0.2 ? (0.4 + rnd() * 0.9) * Math.max(0.35, diurnal(start.getHours())) : 0
    }
    if (gran === "hour") return diurnal(start.getHours()) * (0.55 + rnd() * 0.7) * 0.55
    if (gran === "day") {
        const wd = start.getDay()
        return (wd === 0 || wd === 6 ? 0.18 : 0.42) * (0.6 + rnd() * 0.8)
    }
    const age = (Date.now() - +start) / (30 * DAY)
    return 0.3 * Math.max(0.15, 1 - age * 0.07) * (0.7 + rnd() * 0.6)
}

function demoSeries(m, tokens, rnd) {
    const claude = m.provider === "claude"
    const input = Math.round(tokens * (claude ? 0.015 : 0.045) * (0.7 + rnd() * 0.6))
    const cw = claude ? Math.round(tokens * 0.05 * (0.6 + rnd() * 0.8)) : 0
    const out = Math.round(tokens * (claude ? 0.07 : 0.095) * (0.7 + rnd() * 0.6))
    const cr = Math.max(0, tokens - input - cw - out)
    const total = input + cw + out + cr
    const s = {
        provider: m.provider,
        model: m.model,
        requests: Math.max(1, Math.round(total / (claude ? 42000 : 28000))),
        input_tokens: input,
        cache_read_tokens: cr,
        cache_write_tokens: cw,
        output_tokens: out,
        reasoning_tokens: Math.round(out * (claude ? 0.3 : 0.55)),
        total_tokens: total,
        priced: !!m.p,
        cost_usd: 0,
        cost_breakdown: null,
    }
    if (m.p) {
        const b = { input: (input * m.p.in) / 1e6, cache_read: (cr * m.p.cr) / 1e6, cache_write: (cw * m.p.cw) / 1e6, output: (out * m.p.out) / 1e6 }
        s.cost_breakdown = b
        s.cost_usd = b.input + b.cache_read + b.cache_write + b.output
    }
    return s
}

const SUM_FIELDS = ["requests", "input_tokens", "cache_read_tokens", "cache_write_tokens", "output_tokens", "reasoning_tokens", "total_tokens", "cost_usd"]
function sumSeries(list, base) {
    const o = { ...base, priced: true, cost_breakdown: { input: 0, cache_read: 0, cache_write: 0, output: 0 } }
    for (const f of SUM_FIELDS) o[f] = 0
    for (const s of list) {
        for (const f of SUM_FIELDS) o[f] += s[f] || 0
        if (s.priced && s.cost_breakdown) for (const k of Object.keys(o.cost_breakdown)) o.cost_breakdown[k] += s.cost_breakdown[k]
        if (!s.priced) o.priced = false
    }
    if (!o.priced) o.cost_breakdown = null
    return o
}

function demoHistory(gran) {
    const now = new Date()
    const { from } = historyRange(gran, now)
    let start = new Date(from)
    const buckets = []
    const salt = { minute: 11, hour: 23, day: 37, month: 53 }[gran]
    for (let i = 0; i < BUCKETS[gran]; i++) {
        const end = addGran(start, gran)
        const rnd = mulberry(Math.floor(+start / MIN) * 31 + salt)
        const dur = (+end - +start) / MIN
        const elapsed = Math.min(1, Math.max(0, (+now - +start) / (+end - +start)))
        const tokens = 52000 * dur * demoActivity(gran, start, rnd) * elapsed
        const series = []
        if (tokens > 0) {
            for (const m of DEMO_MODELS) {
                const present = rnd() < (gran === "minute" || gran === "hour" ? m.presence : Math.min(1, m.presence + 0.4))
                const share = m.w * (0.55 + rnd() * 0.9)
                if (present && tokens * share > 50) series.push(demoSeries(m, tokens * share, rnd))
            }
        }
        buckets.push({ start: start.toISOString(), series })
        start = end
    }
    const all = buckets.flatMap((b) => b.series)
    const byModel = new Map()
    for (const s of all) {
        const k = seriesKey(s)
        if (!byModel.has(k)) byModel.set(k, [])
        byModel.get(k).push(s)
    }
    const models = [...byModel.values()].map((list) => sumSeries(list, { provider: list[0].provider, model: list[0].model })).sort((a, b) => b.cost_usd - a.cost_usd)
    const totals = sumSeries(all.filter((s) => s.priced), {})
    const unpricedAll = all.filter((s) => !s.priced)
    for (const f of SUM_FIELDS) if (f !== "cost_usd") totals[f] += unpricedAll.reduce((a, s) => a + (s[f] || 0), 0)
    delete totals.priced
    return { granularity: gran, tz: TZ, from, to: now.toISOString(), pricing: { status: "fresh", updated_at: new Date(+now - 2 * HOUR).toISOString() }, buckets, totals, models }
}

        observed: t0 - obsAgo,
        cooldownUntil: cooldown ? t0 + cooldown : null,
        wins: wins.map(([kind, wl, used, resetIn, minutes]) => ({ kind, label: wl, used, resetsAt: t0 + resetIn, minutes })),
        resets: resets && { available: resets[0], id: resets[1], expires: t0 + resets[2] },
        attempts: 0,
    })
    demo = {
        t0,
        providers: [
            { provider: "claude", label: "Claude", accounts: [
                acct("cl-7f3a", "personal@example.com", "Max 20x", "ok", "probe", 8000, "", [["five_hour", "5h", 34, 2 * HOUR + 34 * MIN, 300], ["weekly", "Weekly", 58, 4 * DAY + 7 * HOUR, 10080], ["other", "Weekly · Opus", 71, 4 * DAY + 7 * HOUR, 10080]], [1, "cr-a1", 6 * DAY + 3 * HOUR]),
                acct("cl-91c0", "work@example.it", "Max 5x", "cooldown", "headers", 3 * MIN, "", [["five_hour", "5h", 100, 41 * MIN, 300], ["weekly", "Weekly", 72, 2 * DAY + 3 * HOUR, 10080]], [2, "cr-a2", 2 * DAY + 5 * HOUR], 41 * MIN),
            ] },

function demoLimits() {
    if (!demo) demoInit()
    const now = Date.now()
    const drift = ((now - demo.t0) / MIN) * 0.2
    const iso = (t) => new Date(t).toISOString()
    const providers = demo.providers.map((p) => {
        const accounts = p.accounts.map((a) => ({
            auth_index: a.auth_index,
            label: a.label,
            plan: a.plan,
            disabled: false,
            status: a.status === "cooldown" && a.cooldownUntil && a.cooldownUntil < now ? "ok" : a.status,
            cooldown_until: a.cooldownUntil && a.cooldownUntil > now ? iso(a.cooldownUntil) : null,
            source: a.source,
            observed_at: iso(a.source === "probe" ? now - (a.observed % 15000) - 2000 : a.observed),
            error: a.error,
            windows: a.wins.map((w) => ({
                kind: w.kind,
                label: w.label,
                used_percent: round(a.status === "ok" ? Math.min(100, w.used + drift * (w.kind === "five_hour" ? 1 : 0.2)) : w.used, 1),
                resets_at: iso(w.resetsAt),
                window_minutes: w.minutes,
            })),
            resets: a.resets && { available: a.resets.available, next_credit_id: a.resets.available ? a.resets.id : "", next_expires_at: a.resets.available ? iso(a.resets.expires) : null },
        }))
        const groups = new Map()
        for (const a of accounts) for (const w of a.windows) {
            const k = winKey(w)
            if (!groups.has(k)) groups.set(k, { kind: w.kind, label: w.label, used_percent: 0, capacity_percent: 0, reporting_accounts: 0, next_reset_at: null })
            const g = groups.get(k)
            g.used_percent = round(g.used_percent + w.used_percent, 1)
            g.capacity_percent += 100
            g.reporting_accounts++
            if (!g.next_reset_at || w.resets_at < g.next_reset_at) g.next_reset_at = w.resets_at
        }
        return {
            provider: p.provider,
            label: p.label,
            account_count: accounts.length,
            windows: [...groups.values()],
            resets_available: accounts.reduce((s, a) => s + (a.resets?.available || 0), 0),
            accounts,
        }
    })
    return { checked_at: iso(now), providers }
}

async function demoApi(path, init) {
    await new Promise((r) => setTimeout(r, 220 + Math.random() * 260))
    if (path.endsWith("/limits")) return demoLimits()
    if (path.includes("/history")) return demoHistory(new URL(path, location.href).searchParams.get("granularity") || "hour")
    if (path.endsWith("/limits/reset")) {
        await new Promise((r) => setTimeout(r, 1100))
        const { auth_index, credit_id } = JSON.parse(init.body)
        const a = demo.providers.flatMap((p) => p.accounts).find((x) => x.auth_index === auth_index)
        if (!a) throw new ApiError(404, "not_found", "unknown auth_index")
        if (!a.resets?.available) return { outcome: "no_credit", warning: "" }
        if (a.resets.id !== credit_id) return { outcome: "already_redeemed", warning: "" }
        if (a.auth_index === "cl-7f3a" && a.attempts++ === 0) throw new ApiError(502, "unconfirmed", "Upstream accepted the request but did not confirm the redemption.")
        const drift = ((Date.now() - demo.t0) / MIN) * 0.2
        for (const x of demo.providers.flatMap((p) => p.accounts)) {
            if (x.status === "ok") for (const w of x.wins) w.used = Math.min(100, w.used + drift * (w.kind === "five_hour" ? 1 : 0.2))
        }
        a.resets.available--
        a.resets.id = `${a.resets.id}-next`
        a.status = "ok"
        a.cooldownUntil = null
        let warning = ""
        for (const w of a.wins) {
            if (w.kind === "five_hour") { w.used = 0; w.resetsAt = Date.now() + 5 * HOUR }
            else if (a.auth_index === "cl-91c0") warning = "Weekly window was not reset by upstream."
            else { w.used = 0; w.resetsAt = Date.now() + 7 * DAY }
        }
        demo.t0 = Date.now()
        return { outcome: "reset", warning }
    }
    throw new ApiError(404, "not_found", path)
}
