<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Usage · CLIProxyAPI</title>
<style>
:root {
    color-scheme: dark light;
    --bg: light-dark(#f3f1ec, #090a0d);
    --bg-2: light-dark(#ebe8e1, #0e1014);
    --surface: light-dark(#fffefb, #111318);
    --surface-2: light-dark(#f5f2ec, #181b21);
    --line: light-dark(#1d1b1714, #ffffff10);
    --line-2: light-dark(#1d1b1726, #ffffff1e);
    --track: light-dark(#1d1b1712, #ffffff0e);
    --grid: light-dark(#1d1b170a, #ffffff07);
    --text: light-dark(#17171a, #edebe6);
    --muted: light-dark(#5b5f68, #959ba6);
    --faint: light-dark(#878b94, #5f6570);
    --ok: light-dark(oklch(0.55 0.14 152), oklch(0.8 0.15 152));
    --warn: light-dark(oklch(0.6 0.15 65), oklch(0.83 0.14 78));
    --bad: light-dark(oklch(0.54 0.19 27), oklch(0.72 0.17 25));
    --claude: light-dark(oklch(0.6 0.16 42), oklch(0.75 0.15 46));
    --codex: light-dark(oklch(0.55 0.12 228), oklch(0.79 0.12 214));
    --focus: light-dark(#2350f0, #93b4ff);
    --shadow: light-dark(0 1px 2px #1d1b1710, 0 1px 0 #ffffff06 inset);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
    --sans: "Inter", "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body {
    margin: 0;
    min-height: 100vh;
    font: 14px/1.45 var(--sans);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
        radial-gradient(52rem 26rem at -8% -12%, color-mix(in oklch, var(--claude) 16%, transparent), transparent 70%),
        radial-gradient(52rem 26rem at 108% -12%, color-mix(in oklch, var(--codex) 15%, transparent), transparent 70%);
}
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(to bottom, #000, transparent 55%);
}
button, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0 }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 32px) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }

/* Header */
.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in oklch, var(--bg) 74%, transparent);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; gap: 10px; height: 56px }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.015em; margin-right: auto; min-width: 0 }
.brand-mark { position: relative; width: 22px; height: 14px; flex: none }
.brand-mark::before, .brand-mark::after {
    content: "";
    position: absolute;
    top: 0;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    mix-blend-mode: screen;
}
@media (prefers-color-scheme: light) { .brand-mark::before, .brand-mark::after { mix-blend-mode: multiply } }
.brand-mark::before { left: 0; background: var(--claude) }
.brand-mark::after { right: 0; background: var(--codex) }
.brand-name { white-space: nowrap }
.brand-name span { color: var(--faint); font-weight: 450 }
.demo-badge {
    font: 600 10px var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 6px;
    color: var(--warn);
    background: color-mix(in oklch, var(--warn) 14%, transparent);
}
.live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 99px;
    font: 12px var(--mono);
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none }
.live[data-state="live"] i { background: var(--ok); animation: pulse 2.4s ease-out infinite }
.live[data-state="stale"] i { background: var(--warn) }
.live[data-state="error"] i { background: var(--bad) }
.live[data-state="error"] { color: var(--bad) }
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--ok) 60%, transparent) }
    70%, 100% { box-shadow: 0 0 0 7px transparent }
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 32px;
    padding: 0 12px;
    border-radius: 9px;
    border: 1px solid var(--line-2);
    background: var(--surface);
    font-size: 13px;
    font-weight: 550;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.btn:hover { background: var(--surface-2) }
.btn:disabled { cursor: default; opacity: 0.6 }
.btn-icon { width: 32px; padding: 0 }
.btn-icon svg { width: 16px; height: 16px }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent }
.btn-primary:hover { background: color-mix(in oklch, var(--text) 86%, var(--bg)) }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn-ghost:hover { color: var(--text); background: var(--surface-2) }
.btn-accent {
    color: var(--pc);
    border-color: color-mix(in oklch, var(--pc) 45%, transparent);
    background: color-mix(in oklch, var(--pc) 9%, var(--surface));
}
.btn-accent:hover { background: color-mix(in oklch, var(--pc) 18%, var(--surface)) }
.btn-commit { background: var(--pc); color: light-dark(#fff, #0b0c0f); border-color: transparent }
.btn-commit:hover { background: color-mix(in oklch, var(--pc) 86%, var(--text)) }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; flex: none }
@keyframes spin { to { transform: rotate(360deg) } }
.top .btn.is-busy svg { animation: spin 0.9s linear infinite }

/* Sections */
main { padding-bottom: 48px }
.sec { margin-top: 30px }
.sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 14px }
.sec-title { margin: 0; display: flex; align-items: baseline; gap: 12px; font-size: clamp(21px, 2.4vw, 27px); font-weight: 680; letter-spacing: -0.03em; line-height: 1.1 }
.sec-idx { font: 500 11px var(--mono); letter-spacing: 0.16em; color: var(--faint) }
.sec-meta { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.notice {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    border: 1px solid color-mix(in oklch, var(--warn) 35%, transparent);
    background: color-mix(in oklch, var(--warn) 8%, transparent);
}
.notice::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none }
.notice.bad { border-color: color-mix(in oklch, var(--bad) 35%, transparent); background: color-mix(in oklch, var(--bad) 8%, transparent) }
.notice.bad::before { background: var(--bad) }

/* Segmented controls */
.seg-ctl { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow) }
.seg-ctl legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
fieldset.seg-ctl { margin: 0; min-width: 0 }
.seg-ctl label { position: relative; display: block }
.seg-ctl input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer }
.seg-ctl span { display: block; padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 550; color: var(--muted); transition: background 0.18s, color 0.18s; pointer-events: none }
.seg-ctl label:hover span { color: var(--text) }
.seg-ctl input:checked + span { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2) }
.seg-ctl input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 1px }

/* Provider cards */
.providers { display: grid; align-items: start; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 540px), 1fr)) }
.prov {
    --pc: var(--muted);
    position: relative;
    isolation: isolate;
    padding: 18px 18px 6px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    overflow: hidden;
}
.prov::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, var(--pc), transparent 75%) }
.prov::after { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(28rem 12rem at 0% 0%, color-mix(in oklch, var(--pc) 9%, transparent), transparent 70%); pointer-events: none }
.prov-claude { --pc: var(--claude) }
.prov-codex { --pc: var(--codex) }
.prov-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap }
.prov-name { margin: 0; font-size: 19px; font-weight: 680; letter-spacing: -0.025em; display: flex; align-items: center; gap: 9px }
.prov-glyph { width: 10px; height: 10px; border-radius: 3px; background: var(--pc); box-shadow: 0 0 12px color-mix(in oklch, var(--pc) 70%, transparent); transform: rotate(45deg) }
.prov-codex .prov-glyph { border-radius: 50%; transform: none }
.prov-count { font: 12px var(--mono); color: var(--muted) }
.pill { font: 500 11.5px var(--mono); padding: 3px 9px; border-radius: 99px; white-space: nowrap }
.pill-reset { margin-left: auto; color: var(--pc); background: color-mix(in oklch, var(--pc) 11%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--pc) 30%, transparent) }
.pill-none { margin-left: auto; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line) }

/* Gauges */
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 6px 10px; margin: 14px 0 8px }
.gauge { container-type: inline-size; width: 100%; max-width: 210px; justify-self: center; text-align: center }
.g-dial { position: relative }
.g-dial svg { display: block; width: 100%; height: auto; overflow: visible }
.g-center { position: absolute; inset: 0 0 12% 0; display: flex; flex-direction: column; align-items: center; justify-content: center }
.g-val { font: 640 clamp(19px, 19cqw, 42px)/1 var(--mono); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; transition: color 0.3s }
.g-val small { font-size: 0.5em; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 0.06em }
.g-val.hot { color: var(--warn) }
.g-val.full { color: var(--bad) }
.g-cap { margin-top: 0.35em; font: clamp(10px, 7.4cqw, 12.5px) var(--mono); color: var(--muted) }
.g-label { position: absolute; left: 0; right: 0; bottom: 3%; font: 650 clamp(9.5px, 6.6cqw, 11px) var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 22% }
.g-reset { margin-top: 4px; line-height: 1.3 }
.g-rel { font-size: 13px; font-weight: 620; font-variant-numeric: tabular-nums; letter-spacing: -0.01em }
.g-abs { font-size: 12px; color: var(--muted) }
.g-abs .short { display: none }
@container (max-width: 150px) {
    .g-abs .long { display: none }
    .g-abs .short { display: inline }
}
.g-note { font: 11px var(--mono); color: var(--faint) }
.seg-trk { stroke: var(--track) }
.seg-fill { transition: stroke-dasharray 0.9s var(--ease), stroke-dashoffset 0.9s var(--ease) }
.g-tick { stroke: var(--line-2) }
.g-tick.major { stroke: var(--muted) }

/* Accounts */
.accts { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line) }
.acct { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id act" "wins wins" "msg msg"; gap: 10px 14px; padding: 14px 0; border-bottom: 1px solid var(--line) }
.acct:last-child { border-bottom: 0 }
.acct-id { grid-area: id; display: flex; gap: 10px; align-items: flex-start; min-width: 0 }
.sw { width: 10px; height: 10px; border-radius: 3px; margin-top: 5px; flex: none; background: var(--c) }
.acct-txt { min-width: 0 }
.acct-label { font-weight: 620; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.acct-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; margin-top: 2px; font: 11.5px var(--mono); color: var(--muted) }
.acct-meta .dot::before { content: "·"; margin-right: 8px; color: var(--faint) }
.chip { font: 550 10.5px var(--mono); letter-spacing: 0.04em; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.chip-warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 13%, transparent) }
.chip-bad { color: var(--bad); background: color-mix(in oklch, var(--bad) 13%, transparent) }
.acct-act { grid-area: act; display: flex; align-items: center; gap: 12px; justify-self: end }
.credit { font: 11.5px/1.35 var(--mono); color: var(--muted); text-align: right; white-space: nowrap }
.credit b { color: var(--text); font-weight: 620 }
.wins { grid-area: wins; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; padding-left: 20px }
.win-top { display: flex; justify-content: space-between; gap: 8px; font: 11.5px var(--mono); color: var(--muted) }
.win-top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.win-top .v { color: var(--text); font-weight: 620; font-variant-numeric: tabular-nums }
.win-top .v.hot { color: var(--warn) }
.win-top .v.full { color: var(--bad) }
.bar { position: relative; height: 6px; margin: 5px 0 5px; border-radius: 99px; background: var(--track) }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--c); transition: width 0.9s var(--ease) }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); opacity: 0.5; transition: left 0.9s var(--ease) }
.win-reset { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.win-reset b { color: var(--text); font-weight: 560 }
.acct-msg { grid-area: msg; padding-left: 20px }
.acct-msg:empty { display: none }
.acct-msg > * + * { margin-top: 8px }
.err-line { font: 11.5px var(--mono); color: var(--bad); overflow-wrap: anywhere }
.acct.is-disabled { opacity: 0.55 }
.acct.is-stale .wins { opacity: 0.72 }
.confirm {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid color-mix(in oklch, var(--pc) 45%, transparent);
    background: color-mix(in oklch, var(--pc) 7%, var(--surface));
    animation: pop 0.22s var(--ease) both;
}
.confirm p { flex: 1 1 260px; margin: 0; font-size: 13px }
.confirm-actions { display: flex; gap: 8px; margin-left: auto }
.outcome { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: var(--surface-2); animation: pop 0.22s var(--ease) both }
.outcome::before { content: ""; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--faint); flex: none }
.outcome.ok { background: color-mix(in oklch, var(--ok) 11%, transparent) }
.outcome.ok::before { background: var(--ok) }
.outcome.warn { background: color-mix(in oklch, var(--warn) 11%, transparent) }
.outcome.warn::before { background: var(--warn) }
.outcome.bad { background: color-mix(in oklch, var(--bad) 11%, transparent) }
.outcome.bad::before { background: var(--bad) }
.outcome-body { flex: 1; min-width: 0 }
.outcome-body small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px }
.outcome-acts { display: flex; gap: 6px; flex: none }
.outcome .btn { height: 28px; font-size: 12px }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) } }
.locked { padding: 42px 20px; text-align: center; border-radius: 18px; border: 1px dashed var(--line-2); color: var(--muted) }
.locked h3 { margin: 0 0 6px; color: var(--text); font-size: 17px; letter-spacing: -0.02em }
.locked p { margin: 0 0 16px }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.tile { position: relative; padding: 14px 16px 15px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0 }
.tile-k { font: 550 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted) }
.tile-v { margin: 9px 0 6px; font: 640 clamp(22px, 2.7vw, 33px)/1.05 var(--mono); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile-s { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center }
.tile-meter { display: flex; height: 4px; margin: 0 0 8px; border-radius: 99px; overflow: hidden; background: var(--track) }
.tile-meter i { display: block; height: 100%; transition: width 0.7s var(--ease) }
.pill-unpriced { color: var(--warn); background: color-mix(in oklch, var(--warn) 12%, transparent); font-size: 10.5px; padding: 2px 7px }

/* Legend / filters */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 0 }
.legend-k { font: 550 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin-right: 6px }
.lg {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 28px;
    padding: 0 11px 0 9px;
    border-radius: 99px;
    border: 1px solid var(--line);
    background: var(--surface);
    font: 11.5px var(--mono);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
}
.lg:hover { border-color: var(--line-2) }
.lg i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); transition: background 0.15s }
.lg[aria-pressed="false"] { color: var(--faint); background: transparent; text-decoration: line-through; text-decoration-color: var(--line-2) }
.lg[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c) }
.lg em { font-style: normal; color: var(--warn); font-size: 10px }
.lg-reset { height: 28px; font-size: 12px }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 11.5px var(--mono); color: var(--muted) }
.keys span { display: inline-flex; align-items: center; gap: 6px }
.keys i { width: 9px; height: 9px; border-radius: 3px; background: var(--c) }

/* Chart panels */
.panel { margin-top: 12px; padding: 16px 16px 10px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow) }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; margin-bottom: 10px }
.panel-title { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.panel-title .mono { font-size: 12px; font-weight: 450; color: var(--muted); letter-spacing: 0 }
.panel-note { font: 11.5px var(--mono); color: var(--muted) }
.panel-note.warn { color: var(--warn) }
.loading .chart-svg, .loading .tiles, .loading .tbl-wrap { opacity: 0.5; transition: opacity 0.2s }
.chart { position: relative; border-radius: 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none }
.chart:focus-visible { outline-offset: 4px }
.chart-svg { transition: opacity 0.25s }
.chart svg { display: block; overflow: visible }
.chart .tick line { stroke: var(--line) }
.chart .tick.zero line { stroke: var(--line-2) }
.chart text { fill: var(--faint); font: 10.5px var(--mono); font-variant-numeric: tabular-nums }
.chart .tick { transition: transform 0.55s var(--ease); animation: fade 0.45s both }
.chart .xl { animation: fade 0.45s both }
.bar-r {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transition: x 0.55s var(--ease), y 0.55s var(--ease), width 0.55s var(--ease), height 0.55s var(--ease), opacity 0.3s;
    animation: grow 0.6s var(--ease) var(--d, 0ms) both;
}
.bar-r.partial { opacity: 0.62 }
@keyframes grow { from { transform: scaleY(0) } }
@keyframes fade { from { opacity: 0 } }
.chart-empty { position: absolute; inset: 0 0 26px 52px; display: grid; place-items: center; font: 12px var(--mono); color: var(--faint); pointer-events: none }
.band-hl, .xhair { position: absolute; pointer-events: none }
.band-hl { background: color-mix(in oklch, var(--text) 6%, transparent); border-radius: 3px }
.xhair { width: 1px; background: var(--text); opacity: 0.4 }
.tip {
    position: absolute;
    z-index: 5;
    top: 0;
    left: 0;
    min-width: 190px;
    max-width: 270px;
    padding: 9px 11px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 34px -10px light-dark(#1d1b1740, #000c);
    pointer-events: none;
    font-size: 12px;
}
.tip-h { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-weight: 620 }
.tip-h span { color: var(--muted); font-weight: 450; font-size: 11px }
.tip-r { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 1.5px 0; font: 11.5px var(--mono) }

.sk { border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 30%, color-mix(in oklch, var(--surface-2) 50%, var(--line-2)) 50%, var(--surface-2) 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite }
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: 0 0 } }

/* Table */
.tbl-wrap { overflow-x: auto; margin: 0 -4px }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px }
.tbl th { padding: 8px 10px; text-align: left; font: 550 10.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap }

footer { margin-top: 34px; font: 11.5px/1.6 var(--mono); color: var(--faint) }

/* Auth dialog */
dialog {
    width: min(420px, calc(100vw - 32px));

    background: var(--surface);

}
dialog::backdrop { background: color-mix(in oklch, var(--bg) 55%, transparent); backdrop-filter: blur(6px) }
dialog[open] { animation: pop 0.25s var(--ease) both }
dialog h2 { margin: 14px 0 6px; font-size: 21px; letter-spacing: -0.03em }

dialog label { display: block; margin-bottom: 6px; font: 550 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted) }

dialog input:focus-visible { outline-offset: 0 }

@media (max-width: 860px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}

    .sec-head .controls { width: 100% }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0ms !important;
        transition-duration: 0.001ms !important;

}
